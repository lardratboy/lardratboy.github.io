<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OIL FILM — Möbius Droste Slots</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height:100%; }

  body {
    background:#04010a;
    overflow:hidden;
    font-family:'Space Mono', ui-monospace, monospace;
    color:#dfe6ff;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- ambient oil sheen behind the canvas ---- */
  #sheen {
    position:fixed; inset:-25%;
    background:
      radial-gradient(45% 45% at 50% 50%, rgba(90,20,140,.55) 0%, rgba(0,0,0,0) 70%),
      conic-gradient(from 0deg at 50% 50%,
        #2a0050, #003b4e, #4a2a00, #10004a, #003b3b, #2a0050);
    filter:blur(90px) saturate(1.8);
    opacity:.42;
    animation:swirl 90s linear infinite;
    will-change:transform;
    pointer-events:none;
  }
  @keyframes swirl { to { transform:rotate(360deg) scale(1.15); } }

  #stage { position:fixed; inset:0; }

  /* ---- interference grille (very subtle, not a CRT cosplay) ---- */
  body::after {
    content:"";
    position:fixed; inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.75) 100%);
    mix-blend-mode:multiply;
    pointer-events:none;
    z-index:50;
  }

  /* ---- readout ---- */
  #readout {
    position:fixed; top:22px; left:24px; z-index:60;
    line-height:1.55;
    pointer-events:none;
  }
  .lbl {
    font-size:9px; letter-spacing:.42em; text-transform:uppercase;
    color:rgba(190,205,255,.42);
  }
  .val {
    font-size:34px; font-weight:700; letter-spacing:-.02em;
    background:linear-gradient(96deg,#8affea,#ff5fd0 42%,#ffc46b 78%,#7ea8ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .sub { font-size:10px; letter-spacing:.2em; color:rgba(190,205,255,.5); margin-top:2px; }

  /* ---- controls ---- */
  #panel {
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    z-index:60; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    justify-content:center; max-width:94vw;
  }
  button {
    font-family:inherit; font-size:10px; font-weight:700;
    letter-spacing:.24em; text-transform:uppercase;
    color:#e8eeff; background:rgba(10,4,20,.62);
    border:1px solid rgba(150,120,255,.38);
    padding:11px 16px; cursor:pointer;
    backdrop-filter:blur(6px);
    transition:border-color .18s, color .18s, background .18s, transform .08s;
  }
  button:hover { border-color:#ff5fd0; color:#fff; }
  button:active { transform:translateY(1px); }
  button:focus-visible { outline:2px solid #8affea; outline-offset:2px; }
  button.on { background:rgba(255,95,208,.18); border-color:#ff5fd0; color:#fff; }

  .slider {
    display:flex; align-items:center; gap:9px;
    border:1px solid rgba(150,120,255,.24);
    background:rgba(10,4,20,.62); padding:8px 14px; backdrop-filter:blur(6px);
  }
  .slider span { font-size:9px; letter-spacing:.28em; color:rgba(190,205,255,.55); }
  input[type=range] {
    -webkit-appearance:none; appearance:none;
    width:130px; height:2px; background:rgba(180,160,255,.35); outline:none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
    background:#8affea; cursor:pointer; box-shadow:0 0 10px #8affea;
  }
  input[type=range]::-moz-range-thumb {
    width:12px; height:12px; border:0; border-radius:50%;
    background:#8affea; cursor:pointer; box-shadow:0 0 10px #8affea;
  }

  #hint {
    position:fixed; bottom:6px; left:50%; transform:translateX(-50%);
    z-index:60; font-size:9px; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(190,205,255,.3); white-space:nowrap;
  }

  @media (max-width:640px){
    .val { font-size:26px; }
    button { padding:9px 11px; letter-spacing:.16em; }
    #hint { display:none; }
  }
  @media (prefers-reduced-motion:reduce){ #sheen { animation:none; } }
</style>
</head>
<body>

<div id="sheen"></div>
<div id="stage"></div>

<div id="readout">
  <div class="lbl">Descent</div>
  <div class="val" id="depth">0.000</div>
  <div class="sub" id="status">film stable</div>
</div>

<div id="panel">
  <button id="spin">Spin</button>
  <button id="hypno">Free spin</button>
  <button id="dive" class="on">Dive</button>
  <button id="recenter">Recenter</button>
  <div class="slider">
    <span>Rate</span>
    <input id="rate" type="range" min="-40" max="40" value="11">
  </div>
</div>

<div id="hint">scroll to fall &nbsp;·&nbsp; drag to look &nbsp;·&nbsp; space spins &nbsp;·&nbsp; f frees the reels</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

<script>
/* =====================================================================
   OIL FILM — a Möbius band tiled with slot machines, rendered as a
   self-similar Droste ladder so the fall never lands.

   The trick: L copies of one identical scene, each placed by the
   similarity  S(x) = RATIO * Rz(TWIST) * x  applied t times, where
   t = f - i and f is the global descent phase. Because every copy is
   *literally the same data* (one shared instance-matrix buffer), when
   f wraps 0->1 each level simply inherits its neighbour's role and the
   image is continuous. No rebasing, no seams, no bookkeeping.
   ===================================================================== */

const TAU = Math.PI * 2;

const CFG = {
  LEVELS:      8,      // rungs of the scale ladder
  RATIO:       2.35,   // scale between neighbouring rungs
  TWIST:       0.55,   // radians of roll per rung  -> logarithmic spiral
  CONE:        2.40,   // axial offset per unit scale -> vortex, not a flat ring

  MACHINES:    9,      // slot cabinets tiled around the band
  REELS:       3,
  SLOTS:       9,      // symbols per reel

  RING_R:      4.6,    // Möbius centreline radius
  STRIP_W:     0.9,    // half-width of the band

  MINI_CHANCE: 0.16,   // odds a reel position holds a whole tiny machine

  REEL_R:      0.50,
  REEL_Z:      0.15,
  REEL_X:      0.85,
  MACH_LIFT:   0.55    // how far a cabinet floats off the surface
};

/* ---------- deterministic noise so every rung agrees ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(0x5C0FFEE);

/* =====================================================================
   Geometry
   ===================================================================== */

function mobiusPoint(u, v, out){
  const ch = Math.cos(u * 0.5), sh = Math.sin(u * 0.5);
  const rad = CFG.RING_R + v * ch;
  out[0] = rad * Math.cos(u);
  out[1] = rad * Math.sin(u);
  out[2] = v * sh;
  return out;
}

function buildMobius(uSeg, vSeg){
  const pos = [], nor = [], uvs = [], idx = [];
  const p = [0,0,0], pu = [0,0,0], pv = [0,0,0];
  const e = 1e-3;

  for (let i = 0; i <= uSeg; i++){
    const u = i / uSeg * TAU;
    for (let j = 0; j <= vSeg; j++){
      const v = (j / vSeg * 2 - 1) * CFG.STRIP_W;
      mobiusPoint(u, v, p);
      mobiusPoint(u + e, v, pu);
      mobiusPoint(u, v + e, pv);

      const ax = pu[0]-p[0], ay = pu[1]-p[1], az = pu[2]-p[2];
      const bx = pv[0]-p[0], by = pv[1]-p[1], bz = pv[2]-p[2];
      let nx = ay*bz - az*by, ny = az*bx - ax*bz, nz = ax*by - ay*bx;
      const L = Math.hypot(nx, ny, nz) || 1;

      pos.push(p[0], p[1], p[2]);
      nor.push(nx/L, ny/L, nz/L);
      uvs.push(i/uSeg, j/vSeg);
    }
  }
  for (let i = 0; i < uSeg; i++){
    for (let j = 0; j < vSeg; j++){
      const a = i * (vSeg + 1) + j, b = a + vSeg + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

/* Local frame on the band centreline. The half-twist lives here: as u
   sweeps 0..2pi the "up" of each cabinet rotates a full 180 degrees. */
function machineMatrix(u){
  const cu = Math.cos(u), su = Math.sin(u);
  const ch = Math.cos(u*0.5), sh = Math.sin(u*0.5);

  const T = new THREE.Vector3(-su, cu, 0);              // along the band
  const W = new THREE.Vector3(ch*cu, ch*su, sh);        // across the band
  const N = new THREE.Vector3(-sh*cu, -sh*su, ch);      // off the surface

  const m = new THREE.Matrix4().makeBasis(T, W.clone().negate(), N);
  m.setPosition(
    CFG.RING_R*cu + N.x*CFG.MACH_LIFT,
    CFG.RING_R*su + N.y*CFG.MACH_LIFT,
    N.z*CFG.MACH_LIFT
  );
  return m;
}

function tintGeometry(geo, hex){
  const c = new THREE.Color(hex);
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){ arr[i*3] = c.r; arr[i*3+1] = c.g; arr[i*3+2] = c.b; }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(arr, 3));
  return geo;
}

const SYMBOL_TYPES = ['tetra', 'cube', 'octa', 'dodeca', 'icosa'];

const GEOM = {
  cab:    tintGeometry(new THREE.BoxGeometry(2.5, 1.5, 0.40), 0x1a1030),
  tetra:  tintGeometry(new THREE.TetrahedronGeometry(0.26),   0xff3f7a),
  cube:   tintGeometry(new THREE.BoxGeometry(0.30,0.30,0.30), 0x3fffc4),
  octa:   tintGeometry(new THREE.OctahedronGeometry(0.24),    0x6f8bff),
  dodeca: tintGeometry(new THREE.DodecahedronGeometry(0.23),  0xffc24a),
  icosa:  tintGeometry(new THREE.IcosahedronGeometry(0.23),   0xd66bff)
};

/* =====================================================================
   Scene contents — built once, drawn LEVELS times
   ===================================================================== */

const machines = [];   // { M, reels:[{phase, vel, base, kickIn}] }
const nodes    = [];   // every instance, static and animated
const counts   = {};   // type -> instance count

function alloc(type){ counts[type] = counts[type] || 0; return counts[type]++; }

for (let mi = 0; mi < CFG.MACHINES; mi++){
  const u = mi / CFG.MACHINES * TAU;
  const reels = [];
  for (let ri = 0; ri < CFG.REELS; ri++){
    reels.push({
      phase: rnd() * TAU,
      vel: 0,
      base: 1.1 + rnd() * 2.4,      // free-spin cruising speed
      kickIn: -1
    });
  }
  machines.push({ M: machineMatrix(u), reels });

  nodes.push({ k:0, t:'cab', i:alloc('cab'), m:mi });   // the cabinet itself

  for (let ri = 0; ri < CFG.REELS; ri++){
    const rx = (ri - 1) * CFG.REEL_X;
    for (let si = 0; si < CFG.SLOTS; si++){
      const baseA = si / CFG.SLOTS * TAU;

      if (rnd() < CFG.MINI_CHANCE){
        // a whole machine riding a reel position
        nodes.push({ k:2, t:'cab', i:alloc('cab'), m:mi, r:ri, rx, baseA });
        for (let k = 0; k < 3; k++){
          const ty = SYMBOL_TYPES[(si + k * 2 + mi) % 5];
          nodes.push({
            k:3, t:ty, i:alloc(ty), m:mi, r:ri, rx, baseA,
            mx:(k - 1) * 0.8, baseB: k / 3 * TAU
          });
        }
      } else {
        const ty = SYMBOL_TYPES[(si + ri * 2 + mi) % 5];
        nodes.push({
          k:1, t:ty, i:alloc(ty), m:mi, r:ri, rx, baseA,
          sp:(rnd() * 2 - 1) * 1.7
        });
      }
    }
  }
}

/* One matrix buffer per geometry type, shared by every rung of the
   ladder. Uploaded once per frame, drawn LEVELS times. */
const buffers = {}, attribs = {};
for (const t in counts){
  buffers[t] = new Float32Array(counts[t] * 16);
  attribs[t] = new THREE.InstancedBufferAttribute(buffers[t], 16);
  attribs[t].setUsage(THREE.DynamicDrawUsage);
}

/* =====================================================================
   Materials
   ===================================================================== */

// Thin-film interference grafted onto Phong: keeps instancing, lighting
// and fog plumbing, only rewrites the emissive/albedo term.
const IRID_PATCH = `
  #include <emissivemap_fragment>
  vec3 vdir = normalize( vViewPosition );
  float fres = pow( 1.0 - abs( dot( normalize( normal ), vdir ) ), 1.55 );
  float film = fres * 3.1 + dot( normal, vec3( 0.71, 0.42, 0.56 ) ) * 1.8;
  vec3 irid = 0.5 + 0.5 * cos( 6.28318 * ( film + vec3( 0.0, 0.33, 0.67 ) ) );
  diffuseColor.rgb = mix( diffuseColor.rgb, irid, 0.55 );
  totalEmissiveRadiance += irid * ( 0.14 + 0.86 * fres ) * 0.62;
`;

function makeIridMaterial(){
  const m = new THREE.MeshPhongMaterial({
    vertexColors: true,
    flatShading: true,
    shininess: 110,
    specular: 0x9fb4ff,
    transparent: false,
    opacity: 1
  });
  m.onBeforeCompile = (shader) => {
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <emissivemap_fragment>', IRID_PATCH
    );
  };
  return m;
}

const BAND_VERT = `
varying vec2 vUv;
varying vec3 vN;
varying vec3 vWP;
void main(){
  vUv = uv;
  vec4 wp = modelMatrix * vec4( position, 1.0 );
  vWP = wp.xyz;
  vN = normalize( mat3( modelMatrix ) * normal );
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const BAND_FRAG = `
uniform float uTime;
uniform float uAlpha;
uniform float uMachines;
varying vec2 vUv;
varying vec3 vN;
varying vec3 vWP;

float hash21( vec2 p ){
  p = fract( p * vec2( 123.34, 456.21 ) );
  p += dot( p, p + 45.32 );
  return fract( p.x * p.y );
}
float vnoise( vec2 p ){
  vec2 i = floor( p ), f = fract( p );
  f = f * f * ( 3.0 - 2.0 * f );
  float a = hash21( i );
  float b = hash21( i + vec2( 1.0, 0.0 ) );
  float c = hash21( i + vec2( 0.0, 1.0 ) );
  float d = hash21( i + vec2( 1.0, 1.0 ) );
  return mix( mix( a, b, f.x ), mix( c, d, f.x ), f.y );
}
float fbm( vec2 p ){
  float v = 0.0, a = 0.5;
  for ( int k = 0; k < 5; k++ ){
    v += a * vnoise( p );
    p = p * 2.02 + vec2( 3.1, 1.7 );
    a *= 0.5;
  }
  return v;
}

void main(){
  vec2 p = vec2( vUv.x * 19.0, vUv.y * 2.7 );
  float t = uTime * 0.055;

  // two rounds of domain warping = the way oil actually crawls
  vec2 q = vec2( fbm( p + t ), fbm( p + vec2( 5.2, 1.3 ) - t ) );
  vec2 r = vec2( fbm( p + 2.6 * q + vec2( 1.7, 9.2 ) + t * 1.4 ),
                 fbm( p + 2.6 * q + vec2( 8.3, 2.8 ) - t * 1.1 ) );
  float film = fbm( p + 3.2 * r );

  vec3 V = normalize( cameraPosition - vWP );
  float fres = 1.0 - abs( dot( normalize( vN ), V ) );

  float phase = film * 5.0 + fres * 3.2 + uTime * 0.07;
  vec3 col = 0.5 + 0.5 * cos( 6.28318 * ( phase + vec3( 0.0, 0.33, 0.67 ) ) );
  col *= 0.20 + 1.15 * fres + 0.45 * film;

  // one lit window per cabinet, printed into the film
  float fu = abs( fract( vUv.x * uMachines ) - 0.5 );
  float fv = abs( vUv.y - 0.5 );
  float outer = smoothstep( 0.360, 0.340, fu ) * smoothstep( 0.400, 0.380, fv );
  float inner = smoothstep( 0.300, 0.280, fu ) * smoothstep( 0.320, 0.300, fv );
  float frame = outer - inner;
  col += vec3( 0.85, 0.35, 1.0 ) * frame * 0.85;

  float a = uAlpha * clamp( 0.14 + 0.85 * fres + 0.32 * film + frame, 0.0, 1.0 );
  gl_FragColor = vec4( col, a );
}`;

function makeBandMaterial(){
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime:     { value: 0 },
      uAlpha:    { value: 1 },
      uMachines: { value: CFG.MACHINES }
    },
    vertexShader: BAND_VERT,
    fragmentShader: BAND_FRAG,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide
  });
}

/* =====================================================================
   Renderer / scene
   ===================================================================== */

const stage = document.getElementById('stage');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.02, 400);
camera.position.set(0, 2.2, 10.5);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 1.2);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enableZoom = false;          // the wheel belongs to the descent
controls.enablePan = false;
controls.minDistance = 3;
controls.maxDistance = 40;

scene.add(new THREE.HemisphereLight(0x5522ff, 0x00d8b4, 0.55));
const keyLight = new THREE.DirectionalLight(0xfff0e0, 0.55);
keyLight.position.set(3, 6, 8);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xff59c8, 0.45);
rimLight.position.set(-5, -3, -6);
scene.add(rimLight);

const root = new THREE.Group();
scene.add(root);

const bandGeo = buildMobius(260, 10);
const levels  = [];

for (let i = 0; i < CFG.LEVELS; i++){
  const g = new THREE.Group();
  root.add(g);

  const bandMat = makeBandMaterial();
  const band = new THREE.Mesh(bandGeo, bandMat);
  band.renderOrder = -i;
  band.frustumCulled = false;
  g.add(band);

  const solids = [];
  for (const t in counts){
    const mat = makeIridMaterial();
    const im = new THREE.InstancedMesh(GEOM[t], mat, counts[t]);
    im.instanceMatrix = attribs[t];   // one buffer, every rung
    im.frustumCulled = false;
    im.renderOrder = -i;
    g.add(im);
    solids.push(mat);
  }

  levels.push({ group: g, bandMat, solids });
}

/* =====================================================================
   Per-frame transforms
   ===================================================================== */

const mSlot = new THREE.Matrix4();
const mSlot2 = new THREE.Matrix4();
const mMini = new THREE.Matrix4();
const mOut  = new THREE.Matrix4();
const mCabOff = new THREE.Matrix4().makeTranslation(0, 0, -0.55);
const vPos = new THREE.Vector3();
const vScl = new THREE.Vector3();
const qRot = new THREE.Quaternion();
const eRot = new THREE.Euler();

// A point on a reel: orbit in the local YZ plane, facing outward as it goes.
function slotCompose(out, x, a, radius, zOff, scale, spin){
  vPos.set(x, Math.sin(a) * radius, Math.cos(a) * radius + zOff);
  eRot.set(-a, spin, spin * 0.6, 'XYZ');
  qRot.setFromEuler(eRot);
  vScl.setScalar(scale);
  out.compose(vPos, qRot, vScl);
}

const MINI_S = 0.26;

// Static cabinets, written once.
for (const n of nodes){
  if (n.k !== 0) continue;
  mOut.multiplyMatrices(machines[n.m].M, mCabOff);
  mOut.toArray(buffers.cab, n.i * 16);
}
const dynNodes = nodes.filter(n => n.k !== 0);

function writeInstances(time){
  for (let idx = 0; idx < dynNodes.length; idx++){
    const n = dynNodes[idx];
    const mach = machines[n.m];
    const a = n.baseA + mach.reels[n.r].phase;

    if (n.k === 1){
      slotCompose(mSlot, n.rx, a, CFG.REEL_R, CFG.REEL_Z, 1, n.sp * time);
      mOut.multiplyMatrices(mach.M, mSlot);
      mOut.toArray(buffers[n.t], n.i * 16);

    } else if (n.k === 2){
      slotCompose(mSlot, n.rx, a, CFG.REEL_R, CFG.REEL_Z, MINI_S, 0);
      mSlot.multiply(mCabOff);
      mOut.multiplyMatrices(mach.M, mSlot);
      mOut.toArray(buffers.cab, n.i * 16);

    } else {
      slotCompose(mSlot, n.rx, a, CFG.REEL_R, CFG.REEL_Z, MINI_S, 0);
      mMini.multiplyMatrices(mach.M, mSlot);
      const b = n.baseB + mach.reels[n.r].phase * 2.7 + time * 1.1;
      slotCompose(mSlot2, n.mx, b, 0.55, 0.75, 0.72, time * 2.2);
      mOut.multiplyMatrices(mMini, mSlot2);
      mOut.toArray(buffers[n.t], n.i * 16);
    }
  }
  for (const t in attribs) attribs[t].needsUpdate = true;
}

function smoothstep(a, b, x){
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

// Visible only in the middle of the ladder; both ends must reach zero or
// the wrap would pop.
function rungAlpha(t){
  const deep = -(CFG.LEVELS - 1);
  return smoothstep(deep, deep + 2.0, t) * (1.0 - smoothstep(0.0, 1.0, t));
}

function layoutLadder(f){
  for (let i = 0; i < CFG.LEVELS; i++){
    const lv = levels[i];
    const t = f - i;
    const s = Math.pow(CFG.RATIO, t);
    const a = rungAlpha(t);

    lv.group.scale.setScalar(s);
    lv.group.rotation.z = CFG.TWIST * t;
    lv.group.position.z = CFG.CONE * s;
    lv.group.visible = a > 0.004;

    lv.bandMat.uniforms.uAlpha.value = a;
    for (const m of lv.solids){
      m.opacity = a;
      m.transparent = a < 0.995;
    }
  }
}

/* =====================================================================
   Reels
   ===================================================================== */

const State = {
  f: 0,
  totalDepth: 0,
  rate: 0.11,
  diving: true,
  hypno: false,
  time: 0,
  flick: 0        // scroll momentum
};

const DETENT = TAU / CFG.SLOTS;

function updateReels(dt){
  for (const mach of machines){
    for (const r of mach.reels){
      if (r.kickIn >= 0){
        r.kickIn -= dt;
        if (r.kickIn < 0) r.vel = 16 + rnd() * 12;
      }

      if (State.hypno){
        r.vel += (r.base - r.vel) * Math.min(1, dt * 1.8);
      } else if (Math.abs(r.vel) > 1.3){
        r.vel *= Math.exp(-0.9 * dt);
      } else {
        // settle into the nearest detent like a real reel brake
        const err = Math.round(r.phase / DETENT) * DETENT - r.phase;
        r.vel += err * 34 * dt;
        r.vel *= Math.exp(-7.5 * dt);
      }
      r.phase += r.vel * dt;
    }
  }
}

function spinAll(){
  machines.forEach((mach, mi) => {
    mach.reels.forEach((r, ri) => { r.kickIn = mi * 0.05 + ri * 0.13; });
  });
  setStatus('reels released');
}

/* =====================================================================
   UI
   ===================================================================== */

const elDepth  = document.getElementById('depth');
const elStatus = document.getElementById('status');
const btnSpin  = document.getElementById('spin');
const btnHypno = document.getElementById('hypno');
const btnDive  = document.getElementById('dive');
const btnHome  = document.getElementById('recenter');
const inRate   = document.getElementById('rate');

let statusTimer = 0;
function setStatus(text){ elStatus.textContent = text; statusTimer = 2.4; }

btnSpin.addEventListener('click', spinAll);

btnHypno.addEventListener('click', () => {
  State.hypno = !State.hypno;
  btnHypno.classList.toggle('on', State.hypno);
  setStatus(State.hypno ? 'reels will not stop' : 'reels braking');
});

btnDive.addEventListener('click', () => {
  State.diving = !State.diving;
  btnDive.classList.toggle('on', State.diving);
  setStatus(State.diving ? 'descending' : 'holding depth');
});

btnHome.addEventListener('click', () => {
  new TWEEN.Tween(camera.position).to({ x:0, y:2.2, z:10.5 }, 900)
    .easing(TWEEN.Easing.Cubic.InOut).start();
  new TWEEN.Tween(controls.target).to({ x:0, y:0, z:1.2 }, 900)
    .easing(TWEEN.Easing.Cubic.InOut).start();
  setStatus('view recentred');
});

inRate.addEventListener('input', () => {
  State.rate = parseFloat(inRate.value) / 100;
});

window.addEventListener('wheel', (e) => {
  State.flick += e.deltaY * 0.00035;
}, { passive: true });

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space'){ e.preventDefault(); spinAll(); }
  else if (e.key === 'f' || e.key === 'F') btnHypno.click();
  else if (e.key === 'd' || e.key === 'D') btnDive.click();
  else if (e.key === 'r' || e.key === 'R') btnHome.click();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =====================================================================
   Loop
   ===================================================================== */

const clock = new THREE.Clock();
let bandTime = 0;

spinAll();

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  State.time += dt;
  bandTime += dt;

  // descent = auto rate + scroll momentum
  let df = (State.diving ? State.rate : 0) * dt + State.flick;
  State.flick *= Math.exp(-6 * dt);
  if (Math.abs(State.flick) < 1e-5) State.flick = 0;

  State.f += df;
  State.totalDepth += df;
  State.f -= Math.floor(State.f);      // wrap into [0,1) — the whole trick

  updateReels(dt);
  writeInstances(State.time);
  layoutLadder(State.f);

  // slow global precession so the vortex never repeats its silhouette
  root.rotation.z = State.time * 0.035;
  root.rotation.x = Math.sin(State.time * 0.11) * 0.10;
  root.rotation.y = Math.cos(State.time * 0.083) * 0.10;

  for (const lv of levels) lv.bandMat.uniforms.uTime.value = bandTime;

  elDepth.textContent = State.totalDepth.toFixed(3);
  if (statusTimer > 0){
    statusTimer -= dt;
    if (statusTimer <= 0) elStatus.textContent = 'film stable';
  }

  TWEEN.update();
  controls.update();
  renderer.render(scene, camera);
}

frame();

console.log('[oil film] rungs', CFG.LEVELS,
            '· instances/rung', Object.values(counts).reduce((a,b)=>a+b,0),
            '· draw calls', CFG.LEVELS * (1 + Object.keys(counts).length));
</script>
