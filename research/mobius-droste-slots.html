<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Möbius Droste Slots — eversion</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }

  body {
    background:#04010a;
    overflow:hidden;
    font-family:'Space Mono', ui-monospace, monospace;
    color:#dfe6ff;
    -webkit-font-smoothing:antialiased;
    --accent:#ff5fd0;
    --accent2:#8affea;
  }

  #sheen {
    position:fixed; inset:-25%;
    background:
      radial-gradient(45% 45% at 50% 50%, rgba(90,20,140,.55) 0%, rgba(0,0,0,0) 70%),
      conic-gradient(from 0deg at 50% 50%, #2a0050, #003b4e, #4a2a00, #10004a, #003b3b, #2a0050);
    filter:blur(90px) saturate(1.8);
    opacity:.42;
    animation:swirl 90s linear infinite;
    will-change:transform;
    pointer-events:none;
    transition:opacity .5s;
  }
  @keyframes swirl { to { transform:rotate(360deg) scale(1.15); } }

  body[data-mode="cabinet"] #sheen {
    background:
      radial-gradient(50% 50% at 50% 55%, rgba(20,0,60,.7) 0%, rgba(0,0,0,0) 72%),
      conic-gradient(from 0deg at 50% 50%, #12003a, #00303c, #3a0030, #001a3a, #12003a);
    opacity:.30;
  }
  body[data-mode="chassis"] #sheen {
    background:radial-gradient(55% 55% at 50% 50%, rgba(0,60,80,.55) 0%, rgba(0,0,0,0) 75%);
    opacity:.35;
  }
  body[data-mode="monolith"] #sheen {
    background:radial-gradient(50% 50% at 50% 42%, rgba(30,34,50,.7) 0%, rgba(0,0,0,0) 75%);
    opacity:.5;
  }

  #stage { position:fixed; inset:0; }

  body::after {
    content:"";
    position:fixed; inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.75) 100%);
    mix-blend-mode:multiply;
    pointer-events:none;
    z-index:50;
  }

  #readout { position:fixed; top:22px; left:24px; z-index:60; line-height:1.55; pointer-events:none; }
  .lbl { font-size:9px; letter-spacing:.42em; text-transform:uppercase; color:rgba(190,205,255,.42); }
  .val {
    font-size:34px; font-weight:700; letter-spacing:-.02em;
    background:linear-gradient(96deg, var(--accent2), var(--accent) 48%, #ffc46b 80%, #7ea8ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .sub { font-size:10px; letter-spacing:.2em; color:rgba(190,205,255,.5); margin-top:2px; }

  #panel {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    z-index:60; display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    justify-content:center; max-width:96vw;
  }
  button, select {
    font-family:inherit; font-size:10px; font-weight:700;
    letter-spacing:.22em; text-transform:uppercase;
    color:#e8eeff; background:rgba(10,4,20,.62);
    border:1px solid rgba(150,120,255,.38);
    padding:11px 15px; cursor:pointer;
    backdrop-filter:blur(6px);
    transition:border-color .18s, color .18s, background .18s, transform .08s;
  }
  button:hover, select:hover { border-color:var(--accent); color:#fff; }
  button:active { transform:translateY(1px); }
  button:focus-visible, select:focus-visible { outline:2px solid var(--accent2); outline-offset:2px; }
  button.on { background:rgba(255,95,208,.18); border-color:var(--accent); color:#fff; }

  select {
    -webkit-appearance:none; appearance:none;
    padding-right:32px;
    background-image:linear-gradient(45deg, transparent 50%, #9fb4ff 50%),
                     linear-gradient(135deg, #9fb4ff 50%, transparent 50%);
    background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%;
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
  }
  select option { background:#0a0416; color:#e8eeff; letter-spacing:normal; }

  .slider {
    display:flex; align-items:center; gap:9px;
    border:1px solid rgba(150,120,255,.24);
    background:rgba(10,4,20,.62); padding:8px 13px; backdrop-filter:blur(6px);
  }
  .slider span { font-size:9px; letter-spacing:.26em; color:rgba(190,205,255,.55); }
  input[type=range] { -webkit-appearance:none; appearance:none; width:104px; height:2px; background:rgba(180,160,255,.35); outline:none; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
    background:var(--accent2); cursor:pointer; box-shadow:0 0 10px var(--accent2);
  }
  input[type=range]::-moz-range-thumb {
    width:12px; height:12px; border:0; border-radius:50%;
    background:var(--accent2); cursor:pointer; box-shadow:0 0 10px var(--accent2);
  }

  #hint {
    position:fixed; bottom:5px; left:50%; transform:translateX(-50%);
    z-index:60; font-size:9px; letter-spacing:.2em; text-transform:uppercase;
    color:rgba(190,205,255,.3); white-space:nowrap;
  }

  @media (max-width:820px){
    .val { font-size:26px; }
    button, select { padding:9px 10px; letter-spacing:.12em; }
    input[type=range] { width:78px; }
    #hint { display:none; }
  }
  @media (prefers-reduced-motion:reduce){ #sheen { animation:none; } }
</style>

<body data-mode="oilfilm">

<div id="sheen"></div>
<div id="stage"></div>

<div id="readout">
  <div class="lbl">Descent</div>
  <div class="val" id="depth">0.000</div>
  <div class="sub" id="status">oil film</div>
</div>

<div id="panel">
  <select id="mode" aria-label="Look">
    <option value="chassis">Chassis</option>
    <option value="oilfilm">Oil film</option>

  <select id="twists" aria-label="Half-twists">

</div>

<div id="hint">scroll to fall &nbsp;·&nbsp; drag to look &nbsp;·&nbsp; space spins &nbsp;·&nbsp; f frees the reels &nbsp;·&nbsp; 1–4 switches look</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

<script>
/* =====================================================================
   A Möbius band tiled with slot machines, drawn as a self-similar
   Droste ladder so the fall never lands — and now everting, so the
   band rolls through itself and the machines pinwheel with it.

   THE SURFACE
     P(u,v) = ( (R + v cos T) cos u, (R + v cos T) sin u, v sin T )
     T(u,t) = K·u/2 + phi(t) + amp·sin( n·u − wt )

   T is the roll of the cross-section. The K·u/2 term is the half-twist
   that makes it a Möbius. phi(t) rolls every cross-section at once:
   advance it by 2π and the band has turned completely inside out and
   back. The sin term makes that eversion travel around the loop as a
   wave instead of happening everywhere at once.

   THE LADDER
     LEVELS copies of one identical scene, placed by the similarity
     S(x) = RATIO·Rz(TWIST)·x applied t times, t = f − i. Every copy is
     literally the same instance buffer, so when f wraps 0→1 each rung
     inherits its neighbour's role and the image is continuous.

     phi is coupled to the descent at exactly 2π per level, which is a
     whole period of T — so the eversion rides the fall without ever
     breaking the wrap.
   ===================================================================== */

const TAU = Math.PI * 2;

const CFG = {
  LEVELS:      8,
  RATIO:       2.35,
  TWIST:       0.55,
  CONE:        2.40,

  MACHINES:    9,
  REELS:       3,
  SLOTS:       9,

  RING_R:      4.6,
  STRIP_W:     0.9,

  MINI_CHANCE: 0.16,

  REEL_R:      0.44,
  REEL_Z:      0.15,
  REEL_X:      0.85,
  MACH_LIFT:   0.55,

  HOUSING_Z:  -0.55,
  MINI_S:      0.26,

  WAVE_AMP:    0.62,   // depth of the travelling eversion wave
  WAVE_N:      2.0,    // lobes around the loop (integer, or it won't close)
  EVERT_PER_LEVEL: 1   // full inside-out turns per rung of descent
};

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(0x5C0FFEE);

/* =====================================================================
   Surface parameters — one source of truth, shared by CPU and GPU
   ===================================================================== */

const Surf = {
  phase: 0,      // phi
  waveT: 0,      // wave travel
  twists: 1      // K
};

function tauAt(u){
  return Surf.twists * u * 0.5 + Surf.phase
       + CFG.WAVE_AMP * Math.sin(CFG.WAVE_N * u - Surf.waveT);
}

/* The band carries only (u, v) — the actual positions and normals are
   evaluated in the vertex shader so eversion costs nothing per frame. */
function buildBandLattice(uSeg, vSeg){
  const pos = [], uvs = [], idx = [];
  for (let i = 0; i <= uSeg; i++){
    const u = i / uSeg * TAU;
    for (let j = 0; j <= vSeg; j++){
      const v = (j / vSeg * 2 - 1) * CFG.STRIP_W;
      pos.push(u, v, 0);
      uvs.push(i / uSeg, j / vSeg);
    }
  }
  for (let i = 0; i < uSeg; i++){
    for (let j = 0; j < vSeg; j++){
      const a = i * (vSeg + 1) + j, b = a + vSeg + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

/* Local frame on the centreline. At v = 0 the tangent is just the
   circle's tangent whatever T does, so a machine's orientation depends
   on T alone — it rolls in place as the band everts under it. */
function machineMatrix(out, u, tau){
  const cu = Math.cos(u), su = Math.sin(u);
  const ct = Math.cos(tau), st = Math.sin(tau);

  _T.set(-su, cu, 0);                 // along the band
  _W.set(ct * cu, ct * su, st);       // across the band
  _N.set(-st * cu, -st * su, ct);     // off the surface

  out.makeBasis(_T, _W.negate(), _N);
  out.setPosition(
    CFG.RING_R * cu + _N.x * CFG.MACH_LIFT,
    CFG.RING_R * su + _N.y * CFG.MACH_LIFT,
    _N.z * CFG.MACH_LIFT
  );
  return out;
}
const _T = new THREE.Vector3(), _W = new THREE.Vector3(), _N = new THREE.Vector3();

/* A rectangular tube: the reel housing. Open at the front so you read
   the symbols through it, capped at the back by the cabinet box. */
function housingGeometry(ow, oh, iw, ih, depth){
  const s = new THREE.Shape();
  s.moveTo(-ow/2, -oh/2); s.lineTo(ow/2, -oh/2);
  s.lineTo( ow/2,  oh/2); s.lineTo(-ow/2, oh/2);
  s.closePath();
  const h = new THREE.Path();
  h.moveTo(-iw/2, -ih/2); h.lineTo(-iw/2, ih/2);
  h.lineTo( iw/2,  ih/2); h.lineTo( iw/2, -ih/2);
  h.closePath();
  s.holes.push(h);
  return new THREE.ExtrudeGeometry(s, { depth: depth, bevelEnabled: false, steps: 1 });
}

const SYMBOL_TYPES = ['tetra', 'cube', 'octa', 'dodeca', 'icosa'];

const GEOM = {
  cab:     new THREE.BoxGeometry(2.62, 1.74, 0.40),
  housing: housingGeometry(2.62, 1.74, 2.34, 1.46, 1.50),
  tetra:   new THREE.TetrahedronGeometry(0.26),
  cube:    new THREE.BoxGeometry(0.30, 0.30, 0.30),
  octa:    new THREE.OctahedronGeometry(0.24),
  dodeca:  new THREE.DodecahedronGeometry(0.23),
  icosa:   new THREE.IcosahedronGeometry(0.23)
};
const ALL_TYPES = Object.keys(GEOM);

/* =====================================================================
   Scene contents — built once, drawn LEVELS times
   ===================================================================== */

const machines = [];
const nodes    = [];
const counts   = {};
for (const t of ALL_TYPES) counts[t] = 0;
function alloc(type){ return counts[type]++; }

for (let mi = 0; mi < CFG.MACHINES; mi++){
  const u = mi / CFG.MACHINES * TAU;
  const reels = [];
  for (let ri = 0; ri < CFG.REELS; ri++){
    reels.push({ phase: rnd() * TAU, vel: 0, base: 1.1 + rnd() * 2.4, kickIn: -1 });
  }
  machines.push({ u, M: new THREE.Matrix4(), reels });

  nodes.push({ k:0, t:'cab',     i:alloc('cab'),     m:mi });   // back panel
  nodes.push({ k:0, t:'housing', i:alloc('housing'), m:mi });   // reel housing

  for (let ri = 0; ri < CFG.REELS; ri++){
    const rx = (ri - 1) * CFG.REEL_X;
    for (let si = 0; si < CFG.SLOTS; si++){
      const baseA = si / CFG.SLOTS * TAU;

      if (rnd() < CFG.MINI_CHANCE){
        // an entire machine riding one reel position
        nodes.push({ k:2, t:'cab',     i:alloc('cab'),     m:mi, r:ri, rx, baseA });
        nodes.push({ k:2, t:'housing', i:alloc('housing'), m:mi, r:ri, rx, baseA });
        for (let k = 0; k < 3; k++){
          const ty = SYMBOL_TYPES[(si + k * 2 + mi) % 5];
          nodes.push({ k:3, t:ty, i:alloc(ty), m:mi, r:ri, rx, baseA,
                       mx:(k - 1) * 0.85, baseB: k / 3 * TAU });
        }
      } else {
        const ty = SYMBOL_TYPES[(si + ri * 2 + mi) % 5];
        nodes.push({ k:1, t:ty, i:alloc(ty), m:mi, r:ri, rx, baseA,
                     sp:(rnd() * 2 - 1) * 1.7 });
      }
    }
  }
}

/* One matrix buffer per geometry type, shared by every rung. */
const buffers = {}, attribs = {};
for (const t of ALL_TYPES){
  buffers[t] = new Float32Array(Math.max(1, counts[t]) * 16);
  attribs[t] = new THREE.InstancedBufferAttribute(buffers[t], 16);
  attribs[t].setUsage(THREE.DynamicDrawUsage);
}

/* =====================================================================
   Looks
   ===================================================================== */

const PATCH_IRID = `
  #include <emissivemap_fragment>
  vec3 vdir = normalize( vViewPosition );
  float fres = pow( 1.0 - abs( dot( normalize( normal ), vdir ) ), 1.55 );
  float film = fres * 3.1 + dot( normal, vec3( 0.71, 0.42, 0.56 ) ) * 1.8;
  vec3 irid = 0.5 + 0.5 * cos( 6.28318 * ( film + vec3( 0.0, 0.33, 0.67 ) ) );
  diffuseColor.rgb = mix( diffuseColor.rgb, irid, 0.55 );
  totalEmissiveRadiance += irid * ( 0.14 + 0.86 * fres ) * 0.62;
`;

const PATCH_RIM = `
  #include <emissivemap_fragment>
  vec3 vdir = normalize( vViewPosition );
  float fres = pow( 1.0 - abs( dot( normalize( normal ), vdir ) ), 3.0 );
  totalEmissiveRadiance += vec3( 0.52, 0.60, 0.82 ) * fres * 1.05;
`;

function patched(mat, src){
  mat.onBeforeCompile = (shader) => {
    shader.fragmentShader = shader.fragmentShader.replace('#include <emissivemap_fragment>', src);
  };
  return mat;
}

const LOOKS = {

  oilfilm: {
    status: 'oil film', accent: ['#ff5fd0', '#8affea'],
    tumble: 1.0, housing: false, bandStyle: 0, bandBlend: 'add',
    lights: { hemi:[0x5522ff, 0x00d8b4, 0.55], key:[0xfff0e0, 0.55], rim:[0xff59c8, 0.45] },
    colors: { cab:0x1a1030, housing:0x120a24, tetra:0xff3f7a, cube:0x3fffc4,
              octa:0x6f8bff, dodeca:0xffc24a, icosa:0xd66bff },
    material(type, color){
      return patched(new THREE.MeshPhongMaterial({
        color, flatShading:true, shininess:110, specular:0x9fb4ff
      }), PATCH_IRID);
    }
  },

  cabinet: {
    status: 'cabinet', accent: ['#ff2fb0', '#25dcff'],
    tumble: 0.0, housing: true, bandStyle: 1, bandBlend: 'normal',
    lights: { hemi:[0x8899ff, 0x221133, 0.70], key:[0xffffff, 0.85], rim:[0x44ffff, 0.35] },
    colors: { cab:0x232634, housing:0x0d0f18, tetra:0xff2b2b, cube:0x22ff55,
              octa:0x25dcff, dodeca:0xffe020, icosa:0xff33cc },
    material(type, color){
      const glow = new THREE.Color(color)
        .multiplyScalar(type === 'cab' || type === 'housing' ? 0.10 : 0.45);
      return new THREE.MeshPhongMaterial({
        color, emissive:glow, flatShading:true, shininess:26, specular:0x3a3f55
      });
    }
  },

  chassis: {
    status: 'chassis', accent: ['#7cf9ff', '#b9ff6e'],
    tumble: 0.45, housing: true, bandStyle: 2, bandBlend: 'add',
    lights: { hemi:[0x223344, 0x000000, 0.4], key:[0xffffff, 0.2], rim:[0x00ffff, 0.2] },
    colors: { cab:0x2b6f88, housing:0x7cf9ff, tetra:0x9dfff0, cube:0x9dfff0,
              octa:0x9dfff0, dodeca:0xb9ff6e, icosa:0xb9ff6e },
    material(type, color){ return new THREE.MeshBasicMaterial({ color, wireframe:true }); }
  },

  monolith: {
    status: 'monolith', accent: ['#9fb0d8', '#e8eeff'],
    tumble: 0.22, housing: true, bandStyle: 3, bandBlend: 'normal',
    lights: { hemi:[0x1a2030, 0x000000, 0.35], key:[0xfff4e2, 1.05], rim:[0x5a78ff, 0.55] },
    colors: { cab:0x0e0e14, housing:0x08080c, tetra:0x1c1620, cube:0x161a20,
              octa:0x14181f, dodeca:0x1e1a14, icosa:0x1a1620 },
    material(type, color){
      return patched(new THREE.MeshPhongMaterial({
        color, flatShading:true, shininess:230, specular:0xffffff
      }), PATCH_RIM);
    }
  }
};

/* =====================================================================
   Band shader — evaluates the surface, four dressings
   ===================================================================== */

const BAND_VERT = `
uniform float uPhase;
uniform float uTwists;
uniform float uWaveAmp;
uniform float uWaveN;
uniform float uWaveT;
uniform float uRingR;

varying vec2 vUv;
varying vec3 vN;
varying vec3 vWP;
varying float vRoll;

void main(){
  float u = position.x;
  float v = position.y;
  vUv = uv;

  float tau  = uTwists * u * 0.5 + uPhase + uWaveAmp * sin( uWaveN * u - uWaveT );
  float dtau = uTwists * 0.5 + uWaveAmp * uWaveN * cos( uWaveN * u - uWaveT );
  vRoll = tau;

  float ct = cos( tau ), st = sin( tau );
  float cu = cos( u ),   su = sin( u );
  float A  = uRingR + v * ct;

  vec3 P = vec3( A * cu, A * su, v * st );

  vec3 dPdu = vec3( -A * su - v * st * dtau * cu,
                     A * cu - v * st * dtau * su,
                     v * ct * dtau );
  vec3 dPdv = vec3( ct * cu, ct * su, st );
  vec3 nrm  = normalize( cross( dPdu, dPdv ) );

  vec4 wp = modelMatrix * vec4( P, 1.0 );
  vWP = wp.xyz;
  vN  = normalize( mat3( modelMatrix ) * nrm );
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const BAND_FRAG = `
uniform float uTime;
uniform float uAlpha;
uniform float uMachines;
uniform float uStyle;
varying vec2 vUv;
varying vec3 vN;
varying vec3 vWP;
varying float vRoll;

float hash21( vec2 p ){
  p = fract( p * vec2( 123.34, 456.21 ) );
  p += dot( p, p + 45.32 );
  return fract( p.x * p.y );
}
float vnoise( vec2 p ){
  vec2 i = floor( p ), f = fract( p );
  f = f * f * ( 3.0 - 2.0 * f );
  float a = hash21( i );
  float b = hash21( i + vec2( 1.0, 0.0 ) );
  float c = hash21( i + vec2( 0.0, 1.0 ) );
  float d = hash21( i + vec2( 1.0, 1.0 ) );
  return mix( mix( a, b, f.x ), mix( c, d, f.x ), f.y );
}
float fbm( vec2 p ){
  float v = 0.0, a = 0.5;
  for ( int k = 0; k < 5; k++ ){
    v += a * vnoise( p );
    p = p * 2.02 + vec2( 3.1, 1.7 );
    a *= 0.5;
  }
  return v;
}
float rule( float x, float n, float w ){
  float f = fract( x * n );
  return 1.0 - smoothstep( 0.0, w, min( f, 1.0 - f ) );
}

void main(){
  vec3 V = normalize( cameraPosition - vWP );
  float fres = 1.0 - abs( dot( normalize( vN ), V ) );

  // which face are we looking at? on a Möbius that answer travels.
  float face = step( 0.0, dot( normalize( vN ), V ) );

  float fu = abs( fract( vUv.x * uMachines ) - 0.5 );
  float fv = abs( vUv.y - 0.5 );
  float frame = smoothstep( 0.360, 0.340, fu ) * smoothstep( 0.400, 0.380, fv )
              - smoothstep( 0.300, 0.280, fu ) * smoothstep( 0.320, 0.300, fv );

  vec3 col;
  float a;

  if ( uStyle < 0.5 ) {
    // ---- oil film: two rounds of domain warp, thin-film palette ----
    vec2 p = vec2( vUv.x * 19.0, vUv.y * 2.7 );
    float t = uTime * 0.055;
    vec2 q = vec2( fbm( p + t ), fbm( p + vec2( 5.2, 1.3 ) - t ) );
    vec2 r = vec2( fbm( p + 2.6 * q + vec2( 1.7, 9.2 ) + t * 1.4 ),
                   fbm( p + 2.6 * q + vec2( 8.3, 2.8 ) - t * 1.1 ) );
    float film = fbm( p + 3.2 * r );
    float phase = film * 5.0 + fres * 3.2 + uTime * 0.07 + vRoll * 0.16;
    col = 0.5 + 0.5 * cos( 6.28318 * ( phase + vec3( 0.0, 0.33, 0.67 ) ) );
    col *= 0.20 + 1.15 * fres + 0.45 * film;
    col += vec3( 0.85, 0.35, 1.0 ) * frame * 0.85;
    a = uAlpha * clamp( 0.14 + 0.85 * fres + 0.32 * film + frame, 0.0, 1.0 );

  } else if ( uStyle < 1.5 ) {
    // ---- cabinet: a deck the machines are bolted to, lit face / dark back ----
    float deck = rule( vUv.x, uMachines * 4.0, 0.03 ) + rule( vUv.y, 8.0, 0.05 );
    col = mix( vec3( 0.018, 0.016, 0.038 ), vec3( 0.045, 0.036, 0.092 ), face );
    col += vec3( 0.10, 0.06, 0.20 ) * fres;
    col += vec3( 0.16, 0.05, 0.24 ) * clamp( deck, 0.0, 1.0 ) * ( 0.25 + 0.55 * face );
    float bay = step( 0.5, fract( vUv.x * uMachines * 0.5 ) );
    col += mix( vec3( 1.0, 0.18, 0.68 ), vec3( 0.14, 0.86, 1.0 ), bay ) * frame * ( 0.35 + 1.4 * face );
    a = uAlpha * clamp( 0.90 + frame, 0.0, 1.0 );

  } else if ( uStyle < 2.5 ) {
    // ---- chassis: the parameterisation itself, nothing else ----
    float g = max( rule( vUv.x, uMachines * 6.0, 0.010 ), rule( vUv.y, 6.0, 0.030 ) );
    float edge = 1.0 - smoothstep( 0.0, 0.035, min( vUv.y, 1.0 - vUv.y ) );
    float seam = rule( vUv.x, uMachines, 0.004 );
    float w = clamp( g * 0.55 + edge + seam * 0.9, 0.0, 1.0 );
    col = mix( vec3( 0.28, 0.86, 1.0 ), vec3( 0.72, 1.0, 0.43 ), edge ) * ( 0.45 + 0.9 * fres );
    col *= 0.55 + 0.75 * face;
    col += vec3( 1.0 ) * frame * 0.5;
    a = uAlpha * w;

  } else {
    // ---- monolith: matte stone, light only at the silhouette ----
    float grain = fbm( vec2( vUv.x * 60.0, vUv.y * 9.0 ) );
    col = vec3( 0.020, 0.021, 0.028 ) * ( 0.7 + 0.6 * grain ) * ( 0.6 + 0.7 * face );
    col += vec3( 0.34, 0.40, 0.62 ) * pow( fres, 3.2 ) * 1.7;
    col += vec3( 0.55, 0.60, 0.78 ) * frame * 0.30;
    a = uAlpha * clamp( 0.88 + 0.12 * fres, 0.0, 1.0 );
  }

  gl_FragColor = vec4( col, a );
}`;

function makeBandMaterial(){
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime:     { value: 0 },
      uAlpha:    { value: 1 },
      uMachines: { value: CFG.MACHINES },
      uStyle:    { value: 0 },
      uPhase:    { value: 0 },
      uTwists:   { value: CFG.WAVE_N * 0 + 1 },
      uWaveAmp:  { value: CFG.WAVE_AMP },
      uWaveN:    { value: CFG.WAVE_N },
      uWaveT:    { value: 0 },
      uRingR:    { value: CFG.RING_R }
    },
    vertexShader: BAND_VERT,
    fragmentShader: BAND_FRAG,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide
  });
}

/* =====================================================================
   Renderer / scene
   ===================================================================== */

const stage = document.getElementById('stage');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.02, 400);
camera.position.set(0, 2.2, 10.5);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 1.2);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enableZoom = false;      // the wheel belongs to the descent
controls.enablePan = false;

const hemiLight = new THREE.HemisphereLight(0x5522ff, 0x00d8b4, 0.55);
const keyLight  = new THREE.DirectionalLight(0xfff0e0, 0.55);
const rimLight  = new THREE.DirectionalLight(0xff59c8, 0.45);
keyLight.position.set(3, 6, 8);
rimLight.position.set(-5, -3, -6);
scene.add(hemiLight, keyLight, rimLight);

const root = new THREE.Group();
scene.add(root);

const bandGeo = buildBandLattice(280, 10);
const levels  = [];

for (let i = 0; i < CFG.LEVELS; i++){
  const group = new THREE.Group();
  root.add(group);

  const bandMat = makeBandMaterial();
  const band = new THREE.Mesh(bandGeo, bandMat);
  band.renderOrder = -i;
  band.frustumCulled = false;         // positions are (u,v); bounds are meaningless
  group.add(band);

  const meshes = {};
  for (const t of ALL_TYPES){
    const im = new THREE.InstancedMesh(GEOM[t], new THREE.MeshBasicMaterial(), counts[t]);
    im.instanceMatrix = attribs[t];   // one buffer, every rung
    im.frustumCulled = false;
    im.renderOrder = -i;
    group.add(im);
    meshes[t] = im;
  }

  levels.push({ group, bandMat, meshes, solids: [] });
}

/* =====================================================================
   Look switching
   ===================================================================== */

let LOOK = LOOKS.oilfilm;

function applyLook(key){
  LOOK = LOOKS[key];
  document.body.dataset.mode = key;
  document.body.style.setProperty('--accent',  LOOK.accent[0]);
  document.body.style.setProperty('--accent2', LOOK.accent[1]);

  const [sky, ground, hi] = LOOK.lights.hemi;
  hemiLight.color.setHex(sky); hemiLight.groundColor.setHex(ground); hemiLight.intensity = hi;
  keyLight.color.setHex(LOOK.lights.key[0]); keyLight.intensity = LOOK.lights.key[1];
  rimLight.color.setHex(LOOK.lights.rim[0]); rimLight.intensity = LOOK.lights.rim[1];

  for (const lv of levels){
    for (const m of lv.solids) m.dispose();
    lv.solids.length = 0;

    for (const t of ALL_TYPES){
      const mesh = lv.meshes[t];
      const mat = LOOK.material(t, LOOK.colors[t]);
      mesh.material = mat;
      mesh.visible = (t === 'housing') ? LOOK.housing : true;
      lv.solids.push(mat);
    }

    lv.bandMat.uniforms.uStyle.value = LOOK.bandStyle;
    if (LOOK.bandBlend === 'add'){
      lv.bandMat.blending = THREE.AdditiveBlending;
      lv.bandMat.depthWrite = false;
    } else {
      lv.bandMat.blending = THREE.NormalBlending;
      lv.bandMat.depthWrite = true;
    }
  }
  setStatus(LOOK.status);
}

/* =====================================================================
   Per-frame transforms
   ===================================================================== */

const mSlot = new THREE.Matrix4();
const mSlot2 = new THREE.Matrix4();
const mMini = new THREE.Matrix4();
const mOut  = new THREE.Matrix4();
const mBack = new THREE.Matrix4().makeTranslation(0, 0, CFG.HOUSING_Z);
const vPos = new THREE.Vector3();
const vScl = new THREE.Vector3();
const qRot = new THREE.Quaternion();
const eRot = new THREE.Euler();

// A point on a reel: orbit in the local YZ plane, facing out as it goes.
function slotCompose(out, x, a, radius, zOff, scale, spin){
  vPos.set(x, Math.sin(a) * radius, Math.cos(a) * radius + zOff);
  eRot.set(-a, spin, spin * 0.6, 'XYZ');
  qRot.setFromEuler(eRot);
  vScl.setScalar(scale);
  out.compose(vPos, qRot, vScl);
}

function updateMachineFrames(){
  for (const mach of machines) machineMatrix(mach.M, mach.u, tauAt(mach.u));
}

function writeInstances(time){
  const tumble = LOOK.tumble;

  for (let idx = 0; idx < nodes.length; idx++){
    const n = nodes[idx];
    const mach = machines[n.m];

    if (n.k === 0){                                   // cabinet body / housing
      mOut.multiplyMatrices(mach.M, mBack);
      mOut.toArray(buffers[n.t], n.i * 16);
      continue;
    }

    const reel = mach.reels[n.r];
    const a = n.baseA + reel.phase;

    if (n.k === 1){                                   // symbol on a reel
      slotCompose(mSlot, n.rx, a, CFG.REEL_R, CFG.REEL_Z, 1, n.sp * time * tumble);
      mOut.multiplyMatrices(mach.M, mSlot);
      mOut.toArray(buffers[n.t], n.i * 16);

    } else if (n.k === 2){                            // a mini machine's shell
      slotCompose(mSlot, n.rx, a, CFG.REEL_R, CFG.REEL_Z, CFG.MINI_S, 0);
      mSlot.multiply(mBack);
      mOut.multiplyMatrices(mach.M, mSlot);
      mOut.toArray(buffers[n.t], n.i * 16);

    } else {                                          // a mini machine's symbol
      slotCompose(mSlot, n.rx, a, CFG.REEL_R, CFG.REEL_Z, CFG.MINI_S, 0);
      mMini.multiplyMatrices(mach.M, mSlot);
      const b = n.baseB + reel.phase * 2.7 + time * 1.1;
      slotCompose(mSlot2, n.mx, b, 0.42, CFG.REEL_Z, 0.75, time * 2.2 * tumble);
      mOut.multiplyMatrices(mMini, mSlot2);
      mOut.toArray(buffers[n.t], n.i * 16);
    }
  }
  for (const t of ALL_TYPES) attribs[t].needsUpdate = true;
}

function smoothstep(a, b, x){
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

// Visible only through the middle of the ladder; both ends must reach
// zero or the wrap would pop.
function rungAlpha(t){
  const deep = -(CFG.LEVELS - 1);
  return smoothstep(deep, deep + 2.0, t) * (1.0 - smoothstep(0.0, 1.0, t));
}

function layoutLadder(f){
  for (let i = 0; i < CFG.LEVELS; i++){
    const lv = levels[i];
    const t = f - i;
    const s = Math.pow(CFG.RATIO, t);
    const a = rungAlpha(t);

    lv.group.scale.setScalar(s);
    lv.group.rotation.z = CFG.TWIST * t;
    lv.group.position.z = CFG.CONE * s;
    lv.group.visible = a > 0.004;

    lv.bandMat.uniforms.uAlpha.value = a;
    for (const m of lv.solids){
      m.opacity = a;
      m.transparent = a < 0.995;
    }
  }
}

/* =====================================================================
   Reels
   ===================================================================== */

const State = {
  f: 0, totalDepth: 0,
  rate: 0.11, evert: 0.14,
  diving: true, hypno: false,
  time: 0, flick: 0, spin: 0
};

const DETENT = TAU / CFG.SLOTS;

function updateReels(dt){
  for (const mach of machines){
    for (const r of mach.reels){
      if (r.kickIn >= 0){
        r.kickIn -= dt;
        if (r.kickIn < 0) r.vel = 16 + rnd() * 12;
      }
      if (State.hypno){
        r.vel += (r.base - r.vel) * Math.min(1, dt * 1.8);
      } else if (Math.abs(r.vel) > 1.3){
        r.vel *= Math.exp(-0.9 * dt);
      } else {
        // settle into the nearest detent like a real reel brake
        const err = Math.round(r.phase / DETENT) * DETENT - r.phase;
        r.vel += err * 34 * dt;
        r.vel *= Math.exp(-7.5 * dt);
      }
      r.phase += r.vel * dt;
    }
  }
}

function spinAll(){
  machines.forEach((mach, mi) => {
    mach.reels.forEach((r, ri) => { r.kickIn = mi * 0.05 + ri * 0.13; });
  });
  setStatus('reels released');
}

/* =====================================================================
   UI
   ===================================================================== */

const elDepth  = document.getElementById('depth');
const elStatus = document.getElementById('status');
const btnSpin  = document.getElementById('spin');
const btnHypno = document.getElementById('hypno');
const btnDive  = document.getElementById('dive');
const btnHome  = document.getElementById('recenter');
const inRate   = document.getElementById('rate');
const inEvert  = document.getElementById('evert');
const selMode  = document.getElementById('mode');
const selTwist = document.getElementById('twists');

let statusTimer = 0;
function setStatus(text){ elStatus.textContent = text; statusTimer = 2.6; }

selMode.addEventListener('change', () => applyLook(selMode.value));

selTwist.addEventListener('change', () => {
  Surf.twists = parseFloat(selTwist.value);
  for (const lv of levels) lv.bandMat.uniforms.uTwists.value = Surf.twists;
  setStatus(Surf.twists === 1 ? 'möbius' :
            Surf.twists % 2 === 0 ? 'two-sided band' : 'möbius, ' + Surf.twists + ' half-twists');
});

btnSpin.addEventListener('click', spinAll);

btnHypno.addEventListener('click', () => {
  State.hypno = !State.hypno;
  btnHypno.classList.toggle('on', State.hypno);
  setStatus(State.hypno ? 'reels will not stop' : 'reels braking');
});

btnDive.addEventListener('click', () => {
  State.diving = !State.diving;
  btnDive.classList.toggle('on', State.diving);
  setStatus(State.diving ? 'descending' : 'holding depth');
});

btnHome.addEventListener('click', () => {
  new TWEEN.Tween(camera.position).to({ x:0, y:2.2, z:10.5 }, 900)
    .easing(TWEEN.Easing.Cubic.InOut).start();
  new TWEEN.Tween(controls.target).to({ x:0, y:0, z:1.2 }, 900)
    .easing(TWEEN.Easing.Cubic.InOut).start();
  setStatus('view recentred');
});

inRate.addEventListener('input',  () => { State.rate  = parseFloat(inRate.value)  / 100; });
inEvert.addEventListener('input', () => { State.evert = parseFloat(inEvert.value) / 100; });

window.addEventListener('wheel', (e) => { State.flick += e.deltaY * 0.00035; }, { passive: true });

const MODE_KEYS = Object.keys(LOOKS);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space'){ e.preventDefault(); spinAll(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= MODE_KEYS.length){
    selMode.value = MODE_KEYS[n - 1];
    applyLook(MODE_KEYS[n - 1]);
    return;
  }
  if (e.key === 'f' || e.key === 'F') btnHypno.click();
  else if (e.key === 'd' || e.key === 'D') btnDive.click();
  else if (e.key === 'r' || e.key === 'R') btnHome.click();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =====================================================================
   Loop
   ===================================================================== */

const clock = new THREE.Clock();
let bandTime = 0;
let evertSpin = 0;

applyLook('chassis'); //'oilfilm');
spinAll();

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  State.time += dt;
  bandTime += dt;

  let df = (State.diving ? State.rate : 0) * dt + State.flick;
  State.flick *= Math.exp(-6 * dt);
  if (Math.abs(State.flick) < 1e-5) State.flick = 0;

  State.f += df;
  State.totalDepth += df;
  State.f -= Math.floor(State.f);          // wrap into [0,1) — the whole trick

  // Eversion: coupled to the fall at whole turns per rung (so the wrap
  // still lands exactly), plus a free-running roll from the slider.
  evertSpin += State.evert * dt;
  Surf.phase = TAU * CFG.EVERT_PER_LEVEL * State.f + evertSpin;
  Surf.waveT = State.time * (0.35 + 2.2 * State.evert);

  updateMachineFrames();
  updateReels(dt);
  writeInstances(State.time);
  layoutLadder(State.f);

  root.rotation.z = State.time * 0.035;
  root.rotation.x = Math.sin(State.time * 0.11) * 0.10;
  root.rotation.y = Math.cos(State.time * 0.083) * 0.10;

  for (const lv of levels){
    const uf = lv.bandMat.uniforms;
    uf.uTime.value  = bandTime;
    uf.uPhase.value = Surf.phase;
    uf.uWaveT.value = Surf.waveT;
  }

  elDepth.textContent = State.totalDepth.toFixed(3);
  if (statusTimer > 0){
    statusTimer -= dt;
    if (statusTimer <= 0) elStatus.textContent = LOOK.status;
  }

  TWEEN.update();
  controls.update();
  renderer.render(scene, camera);
}

frame();

console.log('[mobius droste] rungs', CFG.LEVELS,
            '· instances/rung', Object.values(counts).reduce((a,b) => a + b, 0),
            '· draw calls', CFG.LEVELS * (1 + ALL_TYPES.length));
</script>
</body>
