<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>80s Arcade - Triple Slots</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #050505;
            min-height: 100vh;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            color: #fff;
        }
        
        /* CRT Scanline Effect */
        body::after {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 2px 100%;
            pointer-events: none;
            z-index: 1000;
        }

        #canvas-container { width: 100vw; height: 100vh; }
        
        .ui-overlay {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        
        .btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            padding: 15px 30px;
            border: 4px solid #fff;
            cursor: pointer;
            background: #000;
            color: #fff;
            box-shadow: 6px 6px 0px #ff00ff;
            transition: 0.1s;
        }
        
        .btn.primary { background: #ff00ff; box-shadow: 6px 6px 0px #00ffff; }
        .btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000; }

        .title {
            position: fixed;
            top: 30px;
            width: 100%;
            text-align: center;
            font-size: 20px;
            color: #ffff00;
            text-shadow: 4px 4px 0px #ff0000;
            letter-spacing: -2px;
        }
    </style>
</head>
<body>
    <h1 class="title">POLYTYPE ARCADE: 3-WIDE</h1>
    <div id="canvas-container"></div>
    
    <div class="ui-overlay">
        <button class="btn" id="reset-cam">Reset</button>
        <button class="btn primary" id="spin-btn">SPIN ALL</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <script>
        const Assets = {
            mats: {}, geoms: {},
            colors: {
                tetra: 0xff0000,   // Red
                cube: 0x00ff00,    // Green
                octa: 0x00ffff,    // Cyan
                dodeca: 0xff00ff,  // Magenta
                icosa: 0xffff00,   // Yellow
                cabinet: 0x222222  // Arcade Gray
            },

            init() {
                // 80s Style: No specular highlights, just flat shading
                this.mats.shared = new THREE.MeshLambertMaterial({ vertexColors: true });

                this.geoms.cab = new THREE.BoxGeometry(2, 3.2, 1.2);
                this.applyColors(this.geoms.cab, new THREE.Color(this.colors.cabinet));

                this.geoms.tetra = new THREE.TetrahedronGeometry(0.2);
                this.applyColors(this.geoms.tetra, new THREE.Color(this.colors.tetra));

                this.geoms.cube = new THREE.BoxGeometry(0.22, 0.22, 0.22);
                this.applyColors(this.geoms.cube, new THREE.Color(this.colors.cube));

                this.geoms.octa = new THREE.OctahedronGeometry(0.2);
                this.applyColors(this.geoms.octa, new THREE.Color(this.colors.octa));

                this.geoms.dodeca = new THREE.DodecahedronGeometry(0.2);
                this.applyColors(this.geoms.dodeca, new THREE.Color(this.colors.dodeca));

                this.geoms.icosa = new THREE.IcosahedronGeometry(0.2);
                this.applyColors(this.geoms.icosa, new THREE.Color(this.colors.icosa));
            },

            applyColors(geo, color) {
                const colors = [];
                const pos = geo.attributes.position;
                for (let i = 0; i < pos.count; i++) colors.push(color.r, color.g, color.b);
                geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            }
        };

        class SlotMachine {
            constructor(parent, pos, scale, depth) {
                this.depth = depth;
                this.group = new THREE.Group();
                this.group.position.copy(pos);
                this.group.scale.setScalar(scale);
                this.reels = [];
                this.childMachines = [];
                this.symbolsPerReel = 10;
                
                this.build();
                parent.add(this.group);
            }

            build() {
                const body = new THREE.Mesh(Assets.geoms.cab, Assets.mats.shared);
                this.group.add(body);

                const radius = (this.symbolsPerReel * 0.18);
                const types = ['tetra', 'cube', 'octa', 'dodeca', 'icosa'];

                for (let i = 0; i < 3; i++) {
                    const reel = new THREE.Group();
                    reel.position.set((i - 1) * 0.65, 0.1, 0.35);
                    
                    for (let j = 0; j < this.symbolsPerReel; j++) {
                        const angle = (j / this.symbolsPerReel) * Math.PI * 2;
                        const anchor = new THREE.Group();
                        anchor.position.y = Math.sin(angle) * radius;
                        anchor.position.z = Math.cos(angle) * radius;
                        anchor.rotation.x = -angle;

                        if (Math.random() > 0.85 && this.depth < 2) {
                            const sub = new SlotMachine(anchor, new THREE.Vector3(0,0,0.1), 0.12, this.depth + 1);
                            this.childMachines.push(sub);
                        } else {
                            const type = types[j % types.length];
                            const mesh = new THREE.Mesh(Assets.geoms[type], Assets.mats.shared);
                            anchor.add(mesh);
                        }
                        reel.add(anchor);
                    }
                    this.reels.push(reel);
                    this.group.add(reel);
                }
            }

            spin(delay = 0) {
                setTimeout(() => {
                    this.reels.forEach((r, i) => {
                        const extraRot = (Math.PI * 8) + (Math.random() * Math.PI * 4);
                        new TWEEN.Tween(r.rotation)
                            .to({ x: r.rotation.x + extraRot }, 1800 + (i * 400))
                            .easing(TWEEN.Easing.Quadratic.Out)
                            .onComplete(() => {
                                if (i === 2) this.childMachines.forEach(c => c.spin());
                            })
                            .start();
                    });
                }, delay);
            }
        }

        class App {
            constructor() {
                Assets.init();
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 3, 12);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x050505);
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);
                
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;

                this.setupLighting();
                
                // CREATE THREE MACHINES
                this.machines = [];
                const spacing = 3.5;
                for(let i = 0; i < 3; i++) {
                    const m = new SlotMachine(this.scene, new THREE.Vector3((i - 1) * spacing, 0, 0), 1, 0);
                    this.machines.push(m);
                }
                
                document.getElementById('spin-btn').onclick = () => {
                    // Stagger the activation of each machine
                    this.machines.forEach((m, i) => m.spin(i * 250));
                };

                document.getElementById('reset-cam').onclick = () => {
                    new TWEEN.Tween(this.camera.position).to({x:0, y:3, z:12}, 800).start();
                    new TWEEN.Tween(this.controls.target).to({x:0, y:0, z:0}, 800).start();
                };

                this.animate();
            }

            setupLighting() {
                // High ambient light for that flat, bright arcade look
                this.scene.add(new THREE.AmbientLight(0xffffff, 0.7));
                
                const topLight = new THREE.DirectionalLight(0xffffff, 0.6);
                topLight.position.set(0, 10, 5);
                this.scene.add(topLight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                TWEEN.update();
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        new App();
    </script>
</body>
</html>
