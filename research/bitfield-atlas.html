<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitfield Atlas — occupancy fields from binary data</title>
<style>
  html,body{ height:100%; margin:0; background:#06060a; overflow:hidden;
    font:10px/1.45 ui-monospace, Menlo, Consolas, monospace; color:#6a6a7a; letter-spacing:.04em; }
  canvas{ display:block; position:absolute; left:0; top:0; }
  .lbl{ position:absolute; user-select:none; pointer-events:none; white-space:nowrap; }
  .col{ color:#8a8a9e; } .row{ color:#8a8a9e; text-align:right; }
  #sel{ position:absolute; border:1px solid rgba(180,200,255,.75); pointer-events:none;
        display:none; box-shadow:0 0 0 1px rgba(0,0,0,.6) inset; }
  #hud{ position:fixed; right:10px; top:10px; text-align:right; white-space:pre;
        background:rgba(0,0,0,.55); padding:9px 13px; border-radius:6px;
        border:1px solid rgba(255,255,255,.07); pointer-events:none; max-height:calc(100vh - 110px);
        overflow:hidden; }
  #hud b{ color:#a0a0b2; font-weight:normal; }
  #hud .sec{ color:#3e3e4c; } #hud .warn{ color:#c8a050; } #hud .ok{ color:#6ac08a; }
  #bar{ position:fixed; left:0; right:0; bottom:0; z-index:8;
        background:rgba(10,10,15,.93); border-top:1px solid rgba(255,255,255,.08);
        padding:7px 12px 9px; display:flex; gap:18px; align-items:center; }
  #bar .grp{ display:flex; flex-direction:column; gap:3px; min-width:150px; }
  #bar .grp.wide{ flex:1; }
  #bar label{ display:flex; justify-content:space-between; color:#5a5a6c; }
  #bar label span{ color:#8fb0d8; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:3px;
    background:#1a1a26; outline:none; border-radius:2px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:11px; height:11px;
    border-radius:50%; background:#7fa8e0; cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:11px; height:11px; border:0; border-radius:50%;
    background:#7fa8e0; cursor:pointer; }
  #toast{ position:fixed; left:50%; top:16px; transform:translateX(-50%); z-index:20;
    background:rgba(20,20,28,.9); color:#c8c8dc; border:1px solid rgba(255,255,255,.15);
    padding:6px 14px; border-radius:4px; opacity:0; transition:opacity .25s ease; pointer-events:none; }
  #busy{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:20;
    background:rgba(16,16,22,.95); color:#b8b8cc; border:1px solid rgba(255,255,255,.14);
    padding:14px 22px; border-radius:6px; display:none; text-align:center; white-space:pre; }
  #drop{ position:fixed; inset:0; background:rgba(40,60,120,.25); display:none; z-index:15;
    border:2px dashed rgba(160,190,255,.6); pointer-events:none; }
  #err{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); display:none;
    background:#1a0008; border:1px solid #f33; color:#f88; padding:24px 30px; border-radius:10px;
    text-align:center; font-size:12px; line-height:1.7; z-index:30; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="sel"></div>
<div id="hud"></div>
<div id="toast"></div>
<div id="busy"></div>
<div id="drop"></div>
<div id="err"><b>WebGPU not available.</b><br>Needs Chrome/Edge 113+ or Safari 18+.</div>

<div id="bar">
  <div class="grp wide">
    <label>window start <span id="vWinA">0%</span></label>
    <input type="range" id="sWinA" min="0" max="31" step="1" value="0">
  </div>
  <div class="grp wide">
    <label>window width <span id="vWinB">all</span></label>
    <input type="range" id="sWinB" min="1" max="32" step="1" value="32">
  </div>
  <div class="grp wide">
    <label>density threshold <span id="vThr">1</span></label>
    <input type="range" id="sThr" min="0" max="100" step="1" value="0">
  </div>
  <div class="grp" style="min-width:120px">
    <label>gain <span id="vGain">1.0</span></label>
    <input type="range" id="sGain" min="-6" max="8" step="1" value="0">
  </div>
</div>

<script>
"use strict";

/* ============================================================================
   BITFIELD ATLAS

   One address, two ways to cut it.

   Every tuple in a binary file decodes to three values. Quantized to B bits
   per axis and Morton-interleaved, that is one 3B-bit address. This tool
   materializes the address space as a dense field rather than the tuples as
   points, which is why cost stops scaling with file size: 50 MB and 50 GB
   both produce the same 2 MiB of occupancy at B=8.

   Three fields are extracted in one compute pass, all indexed by that address:

     occupancy   1 bit    "some tuple landed here"        OR-reduced
     count       u32      "how many landed here"          MAX-reduced
     sliceMask   u32      "which 1/32 of the file"        OR-reduced

   Each is reduced into a pyramid whose parent is the reduction of its 8
   children -- byte-aligned, so a parent bit is one byte read. The tracer
   descends that pyramid and skips whole empty subcubes, and because the three
   tests are ANDed at every level, the render-time uniforms

     levels      how deep to descend   -> spatial zoom  (prefix of the address)
     threshold   count >= T            -> isosurface of the value histogram
     windowMask  which file slices     -> scrub, at 60fps, with no re-extract

   all reject hierarchically. Nothing above is a re-scan of the source.

   Requires WebGPU.  Single file, vanilla JS, no dependencies.
   ========================================================================= */

const SLICES      = 32;            // bits in the slice mask
const MAX_PLANES  = 8;
const EXTRAS_MAXB = 8;             // counts/slice are u32/cell: 64 MiB at B=8
const WG          = 256;

/* ==========================================================================
   LANE SCHEMAS
   A record is a stride and three lanes. That covers a plain xyz stream, a
   coordinate triple buried in a fat record, and a quantization block where
   the first bytes are a scale and the payload is nibbles. The row axis of the
   sheet is a list of these, so pointing at an unknown file and sweeping
   schemas is how you find the one that resolves.
   ========================================================================== */
const LANE = { u8:0, i8:1, u16:2, i16:3, u32:4, i32:5,
               fp16:6, bf16:7, fp32:8, fp8e4m3:9, fp8e5m2:10,
               nibLo:11, nibHi:12, snibLo:13, snibHi:14 };
const LANE_NAME = Object.fromEntries(Object.entries(LANE).map(([k, v]) => [v, k]));

const xyz = (t, sz, base = 0) => [ { off:base, t }, { off:base + sz, t }, { off:base + 2*sz, t } ];

const SCHEMAS = [
  { name:"fp16 xyz",   stride:6,  lanes: xyz(LANE.fp16, 2) },
  { name:"bf16 xyz",   stride:6,  lanes: xyz(LANE.bf16, 2) },
  { name:"fp32 xyz",   stride:12, lanes: xyz(LANE.fp32, 4) },
  { name:"uint8 xyz",  stride:3,  lanes: xyz(LANE.u8,  1) },
  { name:"int8 xyz",   stride:3,  lanes: xyz(LANE.i8,  1) },
  { name:"uint16 xyz", stride:6,  lanes: xyz(LANE.u16, 2) },
  { name:"fp8 e4m3",   stride:3,  lanes: xyz(LANE.fp8e4m3, 1) },
  { name:"uint32 xyz", stride:12, lanes: xyz(LANE.u32, 4) },
  // quantization blocks: skip the scale, read the payload
  { name:"q4_0 /18",   stride:18, lanes:[ {off:2,t:LANE.snibLo}, {off:2,t:LANE.snibHi}, {off:3,t:LANE.snibLo} ] },
  { name:"q8_0 /34",   stride:34, lanes:[ {off:2,t:LANE.i8}, {off:3,t:LANE.i8}, {off:4,t:LANE.i8} ] },
  { name:"q4_K /144",  stride:144, lanes:[ {off:16,t:LANE.snibLo}, {off:16,t:LANE.snibHi}, {off:17,t:LANE.snibLo} ] },
  { name:"q6_K /210",  stride:210, lanes:[ {off:0,t:LANE.i8}, {off:1,t:LANE.i8}, {off:2,t:LANE.i8} ] }
];

/* row axis: each sweep is a list of {label, patch} applied to the base config */
function sweepSchemas(){
  return SCHEMAS.map(s => ({ label:s.name, patch:{ schema:s } }));
}
function sweepStride(base){
  return [6, 8, 12, 16, 20, 24, 32, 48].map(v => ({
    label: "stride " + v,
    patch: { schema: { ...base.schema, stride: v } }
  }));
}
function sweepOffset(base){
  return [0, 1, 2, 3, 4, 5, 6, 7].map(v => ({
    label: "offset " + v,
    patch: { startByte: v }
  }));
}
function sweepGain(){
  return [0.25, 0.5, 1, 2, 4, 8, 16, 40].map(v => ({ label: "gain " + v, patch: { gain: v } }));
}
function sweepCompand(){
  return [[0,1],[1,63],[1,1023],[2,1],[3,0.5],[3,0.25],[4,2],[4,6]].map(([c, p]) => ({
    label: ["linear","log","sqrt","gamma","tanh"][c] + (c === 0 || c === 2 ? "" : " " + p),
    patch: { compand:c, compandParam:p }
  }));
}
const SWEEPS = [
  { name:"schema",  build: sweepSchemas },
  { name:"stride",  build: sweepStride },
  { name:"offset",  build: sweepOffset },
  { name:"gain",    build: sweepGain },
  { name:"compand", build: sweepCompand },
  { name:"single",  build: () => [{ label:"as configured", patch:{} }] }
];

/* ==========================================================================
   SYNTHETIC CORPORA  (so the tool has something to chew before a file lands)
   ========================================================================== */
function f32ToF16(val){
  const fb = new Float32Array(1), ib = new Int32Array(fb.buffer);
  fb[0] = val; const x = ib[0];
  let bits = (x >> 16) & 0x8000, m = (x >> 12) & 0x07ff;
  const e = (x >> 23) & 0xff;
  if (e < 103) return bits;
  if (e > 142){ bits |= 0x7c00; bits |= ((e === 255) ? 0 : 1) && (x & 0x007fffff); return bits; }
  if (e < 113){ m |= 0x0800; bits |= (m >> (114 - e)) + ((m >> (113 - e)) & 1); return bits; }
  bits |= ((e - 112) << 10) | (m >> 1);
  return bits + (m & 1);
}
function rng(seed){
  let h = (seed >>> 0) || 1;
  return () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
}
const gauss = r => { const u = Math.max(1e-9, r()); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*r()); };

const CORPORA = {
  "records/32": (bytes, seed) => {                 // coords behind 26 bytes of junk
    const REC = 32, n = Math.floor(bytes / REC), r = rng(seed);
    const buf = new ArrayBuffer(n * REC), dv = new DataView(buf), u8 = new Uint8Array(buf);
    for (let i = 0; i < n; i++){
      const o = i * REC;
      const th = Math.acos(2*r() - 1), ph = r()*Math.PI*2, rad = 0.62 + gauss(r)*0.015;
      dv.setUint16(o,     f32ToF16(rad*Math.sin(th)*Math.cos(ph)), true);
      dv.setUint16(o + 2, f32ToF16(rad*Math.sin(th)*Math.sin(ph)), true);
      dv.setUint16(o + 4, f32ToF16(rad*Math.cos(th)), true);
      for (let k = 6; k < REC; k++) u8[o + k] = (r() * 256) | 0;
    }
    return buf;
  },
  "torus knot": (bytes, seed) => {
    const n = Math.floor(bytes / 6), r = rng(seed), dv = new DataView(new ArrayBuffer(n * 6));
    for (let i = 0; i < n; i++){
      const t = (i/n)*Math.PI*2*3, cr = Math.cos(3*t) + 2, j = 0.02;
      const x = cr*Math.cos(2*t)*0.28 + gauss(r)*j;
      const y = cr*Math.sin(2*t)*0.28 + gauss(r)*j;
      const z = Math.sin(3*t)*0.28 + gauss(r)*j;
      dv.setUint16(i*6,   f32ToF16(x), true);
      dv.setUint16(i*6+2, f32ToF16(y), true);
      dv.setUint16(i*6+4, f32ToF16(z), true);
    }
    return dv.buffer;
  },
  "weights fp16": (bytes, seed) => {               // N(0,0.02) with rare outliers
    const n = Math.floor(bytes / 2), r = rng(seed), dv = new DataView(new ArrayBuffer(n * 2));
    for (let i = 0; i < n; i++){
      let v = gauss(r) * 0.02;
      if (r() < 0.001) v = (r() < 0.5 ? -1 : 1) * (1.5 + r()*2);
      dv.setUint16(i*2, f32ToF16(v), true);
    }
    return dv.buffer;
  },
  "drifting shells": (bytes, seed) => {            // structure that MOVES down the file
    const n = Math.floor(bytes / 6), r = rng(seed), dv = new DataView(new ArrayBuffer(n * 6));
    for (let i = 0; i < n; i++){
      const u = i / n;                             // radius sweeps with file position
      const rad = 0.18 + 0.62 * u;
      const th = Math.acos(2*r() - 1), ph = r()*Math.PI*2;
      dv.setUint16(i*6,   f32ToF16(rad*Math.sin(th)*Math.cos(ph) + gauss(r)*0.006), true);
      dv.setUint16(i*6+2, f32ToF16(rad*Math.sin(th)*Math.sin(ph) + gauss(r)*0.006), true);
      dv.setUint16(i*6+4, f32ToF16(rad*Math.cos(th) + gauss(r)*0.006), true);
    }
    return dv.buffer;
  },
  "q4_0 blocks": (bytes, seed) => {                // real block layout: fp16 scale + 16B nibbles
    const REC = 18, n = Math.floor(bytes / REC), r = rng(seed);
    const buf = new ArrayBuffer(n * REC), dv = new DataView(buf), u8 = new Uint8Array(buf);
    for (let i = 0; i < n; i++){
      const o = i * REC;
      dv.setUint16(o, f32ToF16(0.01 + 0.04*r()), true);
      const cx = (r()*10|0) - 5, cy = (r()*10|0) - 5;
      for (let k = 0; k < 16; k++){
        const a = Math.max(0, Math.min(15, cx + 8 + Math.round(gauss(r)*1.2)));
        const b = Math.max(0, Math.min(15, cy + 8 + Math.round(gauss(r)*1.2)));
        u8[o + 2 + k] = (b << 4) | a;
      }
    }
    return buf;
  }
};
const CORPUS_NAMES = Object.keys(CORPORA);

/* ==========================================================================
   WGSL — EXTRACTION
   One pass over the file. No compaction: duplicates are idempotent, so
   uniqueness stops being something to detect and the whole slot-allocation
   half of a point pipeline disappears.
   ========================================================================== */
const EXTRACT_WGSL = `
struct EP {
  stride: u32, tuples: u32, startByte: u32, bexp: u32,
  laneOff: vec4<u32>,
  laneType: vec4<u32>,
  gain: f32, compand: u32, compandParam: f32, isLE: u32,
  sliceShift: u32, sliceBase: u32, writeExtras: u32, chunkTupleBase: u32,
};

@group(0) @binding(0) var<storage, read>       raw   : array<u32>;
@group(0) @binding(1) var<storage, read_write> bits  : array<atomic<u32>>;
@group(0) @binding(2) var<storage, read_write> cnts  : array<atomic<u32>>;
@group(0) @binding(3) var<storage, read_write> slices: array<atomic<u32>>;
@group(0) @binding(4) var<uniform>             P     : EP;

fn rU8(off: u32) -> u32 { return (raw[off >> 2u] >> ((off & 3u) * 8u)) & 0xFFu; }
fn rU16(off: u32) -> u32 {
  let lo = rU8(off); let hi = rU8(off + 1u);
  return select((lo << 8u) | hi, lo | (hi << 8u), P.isLE != 0u);
}
fn rU32(off: u32) -> u32 {
  let a = rU8(off); let b = rU8(off+1u); let c = rU8(off+2u); let d = rU8(off+3u);
  return select((a<<24u)|(b<<16u)|(c<<8u)|d, a|(b<<8u)|(c<<16u)|(d<<24u), P.isLE != 0u);
}

fn dFp16(b: u32) -> f32 {
  let s = 1.0 - 2.0*f32((b>>15u)&1u); let e = (b>>10u)&0x1Fu; let m = b & 0x3FFu;
  if (e == 0u) { return s * exp2(-14.0) * (f32(m)/1024.0); }
  if (e == 31u){ return select(s * 65504.0, 0.0, m != 0u); }
  return s * exp2(f32(e) - 15.0) * (1.0 + f32(m)/1024.0);
}
fn dBf16(b: u32) -> f32 {
  let s = 1.0 - 2.0*f32((b>>15u)&1u); let e = (b>>7u)&0xFFu; let m = b & 0x7Fu;
  if (e == 0u)  { return s * exp2(-126.0) * (f32(m)/128.0); }
  if (e == 255u){ return select(s * 3.0e38, 0.0, m != 0u); }
  return s * exp2(f32(e) - 127.0) * (1.0 + f32(m)/128.0);
}
fn dFp8E4M3(b: u32) -> f32 {
  let s = 1.0 - 2.0*f32((b>>7u)&1u); let e = (b>>3u)&0xFu; let m = b & 0x7u;
  if (e == 0u) { return s * exp2(-6.0) * (f32(m)/8.0); }
  if (e == 15u){ return select(s * 448.0, 0.0, m != 0u); }
  return s * exp2(f32(e) - 7.0) * (1.0 + f32(m)/8.0);
}
fn dFp8E5M2(b: u32) -> f32 {
  let s = 1.0 - 2.0*f32((b>>7u)&1u); let e = (b>>2u)&0x1Fu; let m = b & 0x3u;
  if (e == 0u) { return s * exp2(-14.0) * (f32(m)/4.0); }
  if (e == 31u){ return select(s * 57344.0, 0.0, m != 0u); }
  return s * exp2(f32(e) - 15.0) * (1.0 + f32(m)/4.0);
}

// every lane returns a signed value already mapped to roughly [-1,1];
// integer lanes are linear over their range, float lanes go through tanh(gain*v)
fn readLane(base: u32, off: u32, ty: u32, gain: f32) -> f32 {
  let o = base + off;
  switch (ty) {
    case 0u  { return (f32(rU8(o)) / 127.5 - 1.0) * gain; }
    case 1u  { let v = rU8(o); let s = select(i32(v), i32(v) - 256, v > 127u);
               return (f32(s) / 127.5) * gain; }
    case 2u  { return (f32(rU16(o)) / 32767.5 - 1.0) * gain; }
    case 3u  { let v = rU16(o); let s = select(i32(v), i32(v) - 65536, v > 32767u);
               return (f32(s) / 32767.5) * gain; }
    case 4u  { return (f32(rU32(o)) / 2147483647.5 - 1.0) * gain; }
    case 5u  { return (f32(bitcast<i32>(rU32(o))) / 2147483647.5) * gain; }
    case 6u  { return tanh(clamp(dFp16(rU16(o)) * gain, -25.0, 25.0)); }
    case 7u  { return tanh(clamp(dBf16(rU16(o)) * gain, -25.0, 25.0)); }
    case 8u  { return tanh(clamp(bitcast<f32>(rU32(o)) * gain, -25.0, 25.0)); }
    case 9u  { return tanh(clamp(dFp8E4M3(rU8(o)) * gain, -25.0, 25.0)); }
    case 10u { return tanh(clamp(dFp8E5M2(rU8(o)) * gain, -25.0, 25.0)); }
    case 11u { return (f32(rU8(o) & 0xFu) / 7.5 - 1.0) * gain; }
    case 12u { return (f32((rU8(o) >> 4u) & 0xFu) / 7.5 - 1.0) * gain; }
    case 13u { let n = rU8(o) & 0xFu; let s = select(i32(n), i32(n) - 16, n > 7u);
               return (f32(s) / 7.5) * gain; }
    case 14u { let n = (rU8(o) >> 4u) & 0xFu; let s = select(i32(n), i32(n) - 16, n > 7u);
               return (f32(s) / 7.5) * gain; }
    default  { return 0.0; }
  }
}

// companding acts on the unit interval, after the lane has been centred
fn compand(x01: f32, curve: u32, p: f32) -> f32 {
  switch (curve) {
    case 1u { let q = max(p, 1e-4);
              let s = sign(x01 - 0.5);
              let a = abs(x01 - 0.5) * 2.0;
              return 0.5 + s * 0.5 * log2(1.0 + q*a) / log2(1.0 + q); }
    case 2u { let s = sign(x01 - 0.5); let a = abs(x01 - 0.5) * 2.0;
              return 0.5 + s * 0.5 * sqrt(a); }
    case 3u { let s = sign(x01 - 0.5); let a = abs(x01 - 0.5) * 2.0;
              return 0.5 + s * 0.5 * pow(a, max(p, 1e-3)); }
    case 4u { return tanh(p * (x01 - 0.5)) * 0.5 + 0.5; }
    default { return x01; }
  }
}

fn part1by2(n0: u32) -> u32 {
  var n = n0 & 0x3FFu;
  n = (n | (n << 16u)) & 0x030000FFu;
  n = (n | (n <<  8u)) & 0x0300F00Fu;
  n = (n | (n <<  4u)) & 0x030C30C3u;
  n = (n | (n <<  2u)) & 0x09249249u;
  return n;
}

@compute @workgroup_size(${WG})
fn extract(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = gid.x;
  if (i >= P.tuples) { return; }

  let byteOff = P.startByte + (P.chunkTupleBase + i) * P.stride;

  var q: vec3<u32>;
  let side = 1u << P.bexp;
  let half = f32(side) * 0.5;
  for (var a = 0u; a < 3u; a = a + 1u) {
    var v = readLane(byteOff, P.laneOff[a], P.laneType[a], P.gain);
    if (!(v == v)) { v = 0.0; }                        // NaN -> centre
    v = clamp(v, -1.0, 1.0);
    var u = v * 0.5 + 0.5;
    if (P.compand != 0u) { u = compand(u, P.compand, P.compandParam); }
    q[a] = u32(clamp(u * f32(side), 0.0, f32(side) - 1.0));
  }

  let m = part1by2(q.x) | (part1by2(q.y) << 1u) | (part1by2(q.z) << 2u);

  atomicOr(&bits[m >> 5u], 1u << (m & 31u));

  if (P.writeExtras != 0u) {
    atomicAdd(&cnts[m], 1u);
    let sl = min((byteOff - P.sliceBase) >> P.sliceShift, ${SLICES - 1}u);
    atomicOr(&slices[m], 1u << sl);
  }
}
`;

/* ==========================================================================
   WGSL — PYRAMID REDUCTION
   Parent = reduction of 8 children. For the bit field the 8 children are 8
   consecutive bits at a multiple of 8, i.e. one byte, so a parent word is
   eight child words folded byte-wise. Overhead over all levels is 1/7.
   ========================================================================== */
const REDUCE_WGSL = `
struct RP { parentOff: u32, childOff: u32, parents: u32, childLimit: u32 };
@group(0) @binding(0) var<storage, read_write> buf: array<u32>;
@group(0) @binding(1) var<uniform> P: RP;

@compute @workgroup_size(${WG})
fn reduceBits(@builtin(global_invocation_id) gid: vec3<u32>) {
  let pw = gid.x;                                   // one thread per parent WORD
  let parentWords = (P.parents + 31u) / 32u;
  if (pw >= parentWords) { return; }
  var out: u32 = 0u;
  for (var k = 0u; k < 8u; k = k + 1u) {
    let ci = pw * 8u + k;
    if (ci >= P.childLimit) { break; }
    let cw = buf[P.childOff + ci];
    for (var j = 0u; j < 4u; j = j + 1u) {
      if (((cw >> (j * 8u)) & 0xFFu) != 0u) { out = out | (1u << (k * 4u + j)); }
    }
  }
  if (P.parents < 32u) { out = out & ((1u << P.parents) - 1u); }
  buf[P.parentOff + pw] = out;
}

@compute @workgroup_size(${WG})
fn reduceMax(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = gid.x;
  if (i >= P.parents) { return; }
  var m: u32 = 0u;
  let b = P.childOff + i * 8u;
  for (var k = 0u; k < 8u; k = k + 1u) { m = max(m, buf[b + k]); }
  buf[P.parentOff + i] = m;
}

@compute @workgroup_size(${WG})
fn reduceOr(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = gid.x;
  if (i >= P.parents) { return; }
  var m: u32 = 0u;
  let b = P.childOff + i * 8u;
  for (var k = 0u; k < 8u; k = k + 1u) { m = m | buf[b + k]; }
  buf[P.parentOff + i] = m;
}
`;

/* ==========================================================================
   WGSL — RAYMARCH
   classify() returns 0 for occupied, otherwise the cell-extent of the empty
   subcube the ray may skip. All three field tests and the half-spaces reject
   at whatever level they first fail, so a whole 8^k block costs one step.
   ========================================================================== */
const RENDER_WGSL = `
struct RU {
  camPos:   vec4<f32>,
  camFwd:   vec4<f32>,
  camRight: vec4<f32>,
  camUp:    vec4<f32>,
  res:      vec4<f32>,          // xy = viewport size, zw = viewport origin
  iv:       vec4<i32>,          // levels, extras, extrasDepth, palette
  jv:       vec4<i32>,          // ao, steps, planeCount, aaN
  kv:       vec4<u32>,          // threshold, windowMask, _, _
  bitOff:   array<vec4<u32>, 3>,
  extOff:   array<vec4<u32>, 3>,
  planes:   array<vec4<i32>, ${MAX_PLANES}>,
};

@group(0) @binding(0) var<uniform> R: RU;
@group(0) @binding(1) var<storage, read> bits  : array<u32>;
@group(0) @binding(2) var<storage, read> cnts  : array<u32>;
@group(0) @binding(3) var<storage, read> slices: array<u32>;

fn bitOffAt(l: i32) -> u32 { return R.bitOff[l >> 2][l & 3]; }
fn extOffAt(l: i32) -> u32 { return R.extOff[l >> 2][l & 3]; }

fn bitAt(l: i32, idx: u32) -> bool {
  let w = bitOffAt(l) + (idx >> 5u);
  return ((bits[w] >> (idx & 31u)) & 1u) != 0u;
}

/* 0 = occupied, else the extent (in cells) of the subcube to skip.
   planeRej is set to the index of the half-space that rejected, or -1. */
fn classify(c: vec3<i32>, S: i32, planeRej: ptr<function, i32>) -> i32 {
  *planeRej = -1;
  if (any(c < vec3<i32>(0)) || any(c >= vec3<i32>(S))) { return S; }

  var res: array<i32, ${MAX_PLANES}>;
  let pc = R.jv.z;
  for (var p = 0; p < ${MAX_PLANES}; p = p + 1) {
    if (p >= pc) { break; }
    res[p] = R.planes[p].w;
  }

  var size = S;
  var m: u32 = 0u;
  let L = R.iv.x;
  for (var l = 1; l <= 12; l = l + 1) {
    if (l > L) { break; }
    size = size >> 1u;
    let dx = (c.x / size) & 1;
    let dy = (c.y / size) & 1;
    let dz = (c.z / size) & 1;
    let d  = u32(dx) | (u32(dy) << 1u) | (u32(dz) << 2u);
    m = (m << 3u) | d;

    if (!bitAt(l, m)) { return size; }

    if (R.iv.y == 1 && l <= R.iv.z) {
      let e = extOffAt(l) + m;
      if (cnts[e] < R.kv.x) { return size; }
      if ((slices[e] & R.kv.y) == 0u) { return size; }
    }

    // integer half-space residual: S_l = 2*S_{l-1} - A.e, e in {-1,+1}^3.
    // |tail| <= |A|_1 after scaling, so clamping to +-(U+1) gives absorbing
    // states and keeps every intermediate inside i32 at any depth.
    for (var p = 0; p < ${MAX_PLANES}; p = p + 1) {
      if (p >= pc) { break; }
      let A = R.planes[p].xyz;
      let U = abs(A.x) + abs(A.y) + abs(A.z);
      let ex = 2 * dx - 1; let ey = 2 * dy - 1; let ez = 2 * dz - 1;
      var v = 2 * res[p] - (A.x * ex + A.y * ey + A.z * ez);
      v = clamp(v, -(U + 1), U + 1);
      res[p] = v;
      if (v < -U) { *planeRej = p; return size; }
    }
  }
  for (var p = 0; p < ${MAX_PLANES}; p = p + 1) {
    if (p >= pc) { break; }
    if (res[p] < 0) { *planeRej = p; return 1; }
  }
  return 0;
}

fn occCell(c: vec3<i32>, S: i32) -> bool { var rp: i32; return classify(c, S, &rp) == 0; }

struct Hit { hit: bool, t: f32, n: vec3<f32>, c: vec3<i32>, steps: i32 };

fn trace(o: vec3<f32>, d: vec3<f32>, S: i32) -> Hit {
  var H: Hit;
  H.hit = false; H.t = 0.0; H.n = vec3<f32>(0.0, 1.0, 0.0); H.c = vec3<i32>(0); H.steps = 0;

  let inv = 1.0 / d;
  let ta = (vec3<f32>(-1.0) - o) * inv;
  let tb = (vec3<f32>( 1.0) - o) * inv;
  let tn = min(ta, tb); let tf = max(ta, tb);
  let tEnter = max(max(tn.x, tn.y), tn.z);
  let tExit  = min(min(tf.x, tf.y), tf.z);
  var t = max(tEnter, 0.0);
  if (t >= tExit) { return H; }

  var nrm = vec3<f32>(0.0);
  if (tn.x > tn.y) {
    if (tn.x > tn.z) { nrm.x = select(1.0, -1.0, d.x > 0.0); } else { nrm.z = select(1.0, -1.0, d.z > 0.0); }
  } else {
    if (tn.y > tn.z) { nrm.y = select(1.0, -1.0, d.y > 0.0); } else { nrm.z = select(1.0, -1.0, d.z > 0.0); }
  }

  let eps = 2.0 / f32(S) * 1e-3;
  t = t + eps;
  let budget = R.jv.y;

  for (var i = 0; i < 1024; i = i + 1) {
    if (i >= budget) { break; }
    H.steps = i;
    if (t >= tExit) { return H; }
    let p = o + t * d;
    let c = clamp(vec3<i32>(floor((p * 0.5 + 0.5) * f32(S))), vec3<i32>(0), vec3<i32>(S - 1));

    var rp: i32;
    let size = classify(c, S, &rp);
    if (size == 0) { H.hit = true; H.t = t; H.n = nrm; H.c = c; return H; }

    let lo  = (c / size) * size;
    let wlo = vec3<f32>(lo) / f32(S) * 2.0 - 1.0;
    let whi = vec3<f32>(lo + vec3<i32>(size)) / f32(S) * 2.0 - 1.0;
    let tbd = (select(wlo, whi, d >= vec3<f32>(0.0)) - o) * inv;
    var te = min(min(tbd.x, tbd.y), tbd.z);
    nrm = vec3<f32>(0.0);
    if (tbd.x < tbd.y) {
      if (tbd.x < tbd.z) { nrm.x = select(1.0, -1.0, d.x > 0.0); } else { nrm.z = select(1.0, -1.0, d.z > 0.0); }
    } else {
      if (tbd.y < tbd.z) { nrm.y = select(1.0, -1.0, d.y > 0.0); } else { nrm.z = select(1.0, -1.0, d.z > 0.0); }
    }

    // convexity shortcut: if a half-space rejected, jump toward that plane
    // rather than staircasing along it. The target is pushed out by the
    // half-cell extent U/S so the skip can never pass over a cell whose
    // centre is actually inside.
    if (rp >= 0) {
      let An = vec3<f32>(R.planes[rp].xyz);
      let dn = dot(An, d);
      if (dn < -1e-9) {
        let U = abs(An.x) + abs(An.y) + abs(An.z);
        let tp = (f32(R.planes[rp].w) + U / f32(S) - dot(An, o)) / dn;
        if (tp > te) { te = tp; nrm = normalize(An); }
      }
    }
    t = te + eps;
  }
  return H;
}

fn part1by2(n0: u32) -> u32 {
  var n = n0 & 0x3FFu;
  n = (n | (n << 16u)) & 0x030000FFu;
  n = (n | (n <<  8u)) & 0x0300F00Fu;
  n = (n | (n <<  4u)) & 0x030C30C3u;
  n = (n | (n <<  2u)) & 0x09249249u;
  return n;
}
// the address at depth d: the top d digits of the leaf address. Descending
// builds it MSB-first; interleaving the shifted coords gives the same word.
fn mortonAt(c: vec3<i32>, levels: i32, d: i32) -> u32 {
  let sh = u32(levels - d);
  return part1by2(u32(c.x) >> sh) | (part1by2(u32(c.y) >> sh) << 1u)
       | (part1by2(u32(c.z) >> sh) << 2u);
}

fn hsv(h: f32) -> vec3<f32> {
  let k = fract(h) * 6.0;
  return clamp(vec3<f32>(abs(k - 3.0) - 1.0, 2.0 - abs(k - 2.0), 2.0 - abs(k - 4.0)), vec3<f32>(0.0), vec3<f32>(1.0));
}

fn colorize(W: vec3<f32>, c: vec3<i32>, S: i32, H: Hit) -> vec3<f32> {
  let pal = R.iv.w;
  if (pal == 0) { return W * 0.5 + 0.5; }             // position IS the value
  if (pal == 1) {                                     // which part of the file
    if (R.iv.y != 1) { return vec3<f32>(0.34); }
    let ed = min(R.iv.x, R.iv.z);
    let sm = slices[extOffAt(ed) + mortonAt(c, R.iv.x, ed)];
    if (sm == 0u) { return vec3<f32>(0.34); }
    var sum = 0.0; var n = 0.0;
    for (var i = 0u; i < ${SLICES}u; i = i + 1u) {
      if (((sm >> i) & 1u) != 0u) { sum = sum + f32(i); n = n + 1.0; }
    }
    let mean = sum / max(n, 1.0) / ${SLICES}.0;        // hue = centroid slice
    let spread = clamp(n / ${SLICES}.0, 0.0, 1.0);     // desaturate if smeared
    return mix(hsv(mean * 0.78), vec3<f32>(0.6), spread * 0.55) * 0.92 + 0.06;
  }
  if (pal == 2) {                                     // density, log scaled
    if (R.iv.y != 1) { return vec3<f32>(0.34); }
    let ed = min(R.iv.x, R.iv.z);
    let v = f32(cnts[extOffAt(ed) + mortonAt(c, R.iv.x, ed)]);
    let k = clamp(log2(v + 1.0) / 20.0, 0.0, 1.0);
    return vec3<f32>(0.10 + 0.9*k, 0.30 + 0.45*k*k, 0.85 - 0.6*k);
  }
  if (pal == 3) {                                     // FNV over the address
    var h: u32 = 2166136261u; var size = S;
    for (var l = 1; l <= 12; l = l + 1) {
      if (l > R.iv.x) { break; }
      size = size >> 1u;
      let d = u32((c.x/size)&1) | (u32((c.y/size)&1) << 1u) | (u32((c.z/size)&1) << 2u);
      h = (h ^ d) * 16777619u;
    }
    return vec3<f32>(f32(h & 255u), f32((h >> 8u) & 255u), f32((h >> 16u) & 255u)) / 255.0 * 0.8 + 0.12;
  }
  if (pal == 4) {                                     // march cost
    let k = clamp(f32(H.steps) / 96.0, 0.0, 1.0);
    return vec3<f32>(k, k*k*0.8, 1.0 - k);
  }
  return vec3<f32>(0.82);
}

fn render(v: vec2<f32>, S: i32) -> vec3<f32> {
  let o = R.camPos.xyz;
  let d = normalize(v.x * R.camRight.xyz + v.y * R.camUp.xyz + 1.8 * R.camFwd.xyz);
  let ds = sign(d + vec3<f32>(1e-20)) * max(abs(d), vec3<f32>(1e-6));

  let H = trace(o, ds, S);
  if (!H.hit) { return vec3<f32>(0.0); }
  let W = o + H.t * ds;

  var ao = 1.0;
  if (R.jv.x == 1) {
    let n3 = vec3<i32>(round(H.n));
    let f  = H.c + n3;
    let a1 = select(vec3<i32>(1,0,0), vec3<i32>(0,1,0), abs(H.n.x) > 0.5);
    let a2 = vec3<i32>(round(cross(vec3<f32>(n3), vec3<f32>(a1))));
    var nb = 0.0;
    for (var i = -1; i <= 1; i = i + 1) {
      for (var k = -1; k <= 1; k = k + 1) {
        if (i == 0 && k == 0) { continue; }
        if (occCell(f + a1*i + a2*k, S)) { nb = nb + 1.0; }
      }
    }
    ao = 1.0 - 0.5 * (nb / 8.0);
  }
  let key  = 0.55 + 0.45 * max(dot(H.n, normalize(vec3<f32>(0.45, 0.82, 0.36))), 0.0);
  let view = mix(0.70, 1.0, max(dot(H.n, -ds), 0.0));
  return colorize(W, H.c, S, H) * (key * view * ao);
}

@vertex
fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4<f32> {
  let p = vec2<f32>(f32((vi << 1u) & 2u), f32(vi & 2u));
  return vec4<f32>(p * 2.0 - 1.0, 0.0, 1.0);
}

@fragment
fn fs(@builtin(position) fc: vec4<f32>) -> @location(0) vec4<f32> {
  let S = 1 << u32(R.iv.x);
  let aa = R.jv.w;
  var acc = vec3<f32>(0.0);
  var cnt = 0.0;
  for (var j = 0; j < 2; j = j + 1) {
    if (j >= aa) { break; }
    for (var i = 0; i < 2; i = i + 1) {
      if (i >= aa) { break; }
      let off = (vec2<f32>(f32(i), f32(j)) + 0.5) / f32(aa);
      // fc is framebuffer-space; rebase into this viewport, y down -> y up
      let local = vec2<f32>(fc.x - R.res.z, R.res.y - (fc.y - R.res.w));
      acc = acc + render(((local + off - 0.5) * 2.0 - R.res.xy) / R.res.y, S);
      cnt = cnt + 1.0;
    }
  }
  return vec4<f32>(acc / max(cnt, 1.0), 1.0);
}
`;

/* ==========================================================================
   HOST
   ========================================================================== */
const el = id => document.getElementById(id);
const canvas = el("gl");
let device, ctx, fmt;

function toast(msg){
  const t = el("toast");
  t.textContent = msg; t.style.opacity = "1";
  clearTimeout(t._k); t._k = setTimeout(() => { t.style.opacity = "0"; }, 2600);
}
const setBusy = m => { const b = el("busy"); b.style.display = m ? "block" : "none"; if (m) b.textContent = m; };
const yieldFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
function bytesStr(n){
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(1) + " KiB";
  if (n < 1073741824) return (n/1048576).toFixed(1) + " MiB";
  return (n/1073741824).toFixed(2) + " GiB";
}
const numStr = n => Number.isFinite(n) ? Math.round(n).toLocaleString("en-US") : "-";

/* ---- pyramid layouts ---------------------------------------------------- */
// bits: level l holds 8^l bits -> ceil/32 words, min 1
function bitLayout(B){
  const off = new Uint32Array(16), words = new Uint32Array(16);
  let total = 0;
  for (let l = 1; l <= B; l++){
    off[l] = total;
    words[l] = Math.max(1, Math.pow(8, l) / 32);
    total += words[l];
  }
  return { off, words, total };
}
// counts / slices: level l holds 8^l u32
function extLayout(B){
  const off = new Uint32Array(16), n = new Uint32Array(16);
  let total = 0;
  for (let l = 1; l <= B; l++){ off[l] = total; n[l] = Math.pow(8, l); total += n[l]; }
  return { off, n, total };
}

/* ---- camera (shared: one drag orbits every cell) ------------------------ */
let camTheta = Math.PI * 0.30, camPhi = Math.PI * 0.36, camRadius = 3.1;
let autoOrbit = true, orbitT = 0;
function camBasis(){
  const th = camTheta + (autoOrbit ? orbitT * 0.25 : 0);
  const sp = Math.sin(camPhi), cp = Math.cos(camPhi), st = Math.sin(th), ct = Math.cos(th);
  const pos = [camRadius*sp*ct, camRadius*cp, camRadius*sp*st];
  let f = [-pos[0], -pos[1], -pos[2]];
  const fl = Math.hypot(f[0], f[1], f[2]) || 1; f = f.map(v => v/fl);
  let r = [-f[2], 0, f[0]];                          // cross(f, up=(0,1,0))
  const rl = Math.hypot(r[0], r[1], r[2]) || 1; r = r.map(v => v/rl);
  const u = [r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  return { pos, f, r, u };
}

/* ---- state -------------------------------------------------------------- */
const st = {
  corpusIdx: 0, corpusMB: 32, seed: 1337,
  sweepIdx: 0, B: 8, LMIN: 3,
  base: { schema: SCHEMAS[0], startByte: 0, gain: 1, compand: 0, compandParam: 1, isLE: true },
  palette: 0, ao: true, quality: 1, steps: [128, 256, 512],
  winA: 0, winB: SLICES, threshold: 1, thrRaw: 0,
  cut: false, slab: false, slabAxis: 1, slabPos: 0, slabThick: 2,
  rows: [], ROWS: 0, COLS: 1, sel: null, zoom: null,
  corpus: null, corpusName: "", srcBytes: 0, maxCount: 1, extraRow: -1,
  building: false, fps: 0, buildMs: 0
};

/* ---- gpu objects -------------------------------------------------------- */
let rawBuf = null, cntBuf = null, sliceBuf = null;
let extractPipe, reduceBitsPipe, reduceMaxPipe, reduceOrPipe, renderPipe;
let extractBGL, reduceBGL, renderBGL;
let extractUBO, reduceUBO, renderUBO, readbackBuf;
let bitLay = bitLayout(8), extLay = extLayout(EXTRAS_MAXB);
let renderBGs = [];

// the render uniform is 352 bytes; slots must be a multiple of the 256-byte
// dynamic-offset alignment, so 512
const UBO_SLOT = 512;
const REDUCE_SLOTS = 32;
const MAX_ROWS = 12;
const ROW_BUDGET = 320 * 1024 * 1024;   // total occupancy across all rows

async function initGPU(){
  if (!navigator.gpu){ el("err").style.display = "block"; return false; }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!adapter){ el("err").style.display = "block"; return false; }
  const want = { maxStorageBufferBindingSize: 512*1024*1024, maxBufferSize: 768*1024*1024,
                 maxComputeWorkgroupsPerDimension: 65535 };
  const req = {};
  for (const [k, v] of Object.entries(want)) if (adapter.limits[k] !== undefined) req[k] = Math.min(v, adapter.limits[k]);
  device = await adapter.requestDevice({ requiredLimits: req });
  device.lost.then(info => console.error("device lost:", info.message));

  ctx = canvas.getContext("webgpu");
  fmt = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: fmt, alphaMode: "opaque" });

  const ex = device.createShaderModule({ code: EXTRACT_WGSL });
  extractBGL = device.createBindGroupLayout({ entries: [
    { binding:0, visibility:GPUShaderStage.COMPUTE, buffer:{ type:"read-only-storage" } },
    { binding:1, visibility:GPUShaderStage.COMPUTE, buffer:{ type:"storage" } },
    { binding:2, visibility:GPUShaderStage.COMPUTE, buffer:{ type:"storage" } },
    { binding:3, visibility:GPUShaderStage.COMPUTE, buffer:{ type:"storage" } },
    { binding:4, visibility:GPUShaderStage.COMPUTE, buffer:{ type:"uniform" } },
  ]});
  extractPipe = device.createComputePipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts:[extractBGL] }),
    compute: { module: ex, entryPoint: "extract" }
  });

  const rd = device.createShaderModule({ code: REDUCE_WGSL });
  reduceBGL = device.createBindGroupLayout({ entries: [
    { binding:0, visibility:GPUShaderStage.COMPUTE, buffer:{ type:"storage" } },
    { binding:1, visibility:GPUShaderStage.COMPUTE, buffer:{ type:"uniform", hasDynamicOffset:true } },
  ]});
  const rlay = device.createPipelineLayout({ bindGroupLayouts:[reduceBGL] });
  reduceBitsPipe = device.createComputePipeline({ layout:rlay, compute:{ module:rd, entryPoint:"reduceBits" } });
  reduceMaxPipe  = device.createComputePipeline({ layout:rlay, compute:{ module:rd, entryPoint:"reduceMax"  } });
  reduceOrPipe   = device.createComputePipeline({ layout:rlay, compute:{ module:rd, entryPoint:"reduceOr"   } });

  const rs = device.createShaderModule({ code: RENDER_WGSL });
  renderBGL = device.createBindGroupLayout({ entries: [
    { binding:0, visibility:GPUShaderStage.FRAGMENT, buffer:{ type:"uniform", hasDynamicOffset:true } },
    { binding:1, visibility:GPUShaderStage.FRAGMENT, buffer:{ type:"read-only-storage" } },
    { binding:2, visibility:GPUShaderStage.FRAGMENT, buffer:{ type:"read-only-storage" } },
    { binding:3, visibility:GPUShaderStage.FRAGMENT, buffer:{ type:"read-only-storage" } },
  ]});
  renderPipe = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts:[renderBGL] }),
    vertex:   { module: rs, entryPoint: "vs" },
    fragment: { module: rs, entryPoint: "fs", targets: [{ format: fmt }] },
    primitive: { topology: "triangle-list" }
  });

  extractUBO  = device.createBuffer({ size: 96, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  reduceUBO   = device.createBuffer({ size: UBO_SLOT * REDUCE_SLOTS, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  renderUBO   = device.createBuffer({ size: UBO_SLOT * MAX_ROWS * 12, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  readbackBuf = device.createBuffer({ size: 64, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  return true;
}

/* ---- allocation --------------------------------------------------------- */
function allocFields(){
  bitLay = bitLayout(st.B);
  extLay = extLayout(Math.min(st.B, EXTRAS_MAXB));
  const bitBytes = bitLay.total * 4;
  const extBytes = extLay.total * 4;

  for (const r of st.rows) if (r.buf) r.buf.destroy();
  if (cntBuf) cntBuf.destroy();
  if (sliceBuf) sliceBuf.destroy();
  cntBuf   = device.createBuffer({ size: extBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
  sliceBuf = device.createBuffer({ size: extBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
  return { bitBytes, extBytes };
}

/* ---- corpus ------------------------------------------------------------- */
async function makeCorpus(){
  st.corpusName = CORPUS_NAMES[st.corpusIdx];
  setBusy(`synthesizing ${st.corpusName}\n${st.corpusMB} MiB`);
  await yieldFrame();
  st.corpus = CORPORA[st.corpusName](st.corpusMB * 1048576, st.seed);
  uploadCorpus();
}
function uploadCorpus(){
  const cap = device.limits.maxStorageBufferBindingSize;
  let src = st.corpus;
  if (src.byteLength > cap){
    src = src.slice(0, cap);
    toast(`truncated to ${bytesStr(cap)} (storage binding limit)`);
  }
  // writeBuffer requires a size that is a multiple of 4, and the shader reads
  // whole words, so the tail is padded rather than written short
  const padded = Math.max(16, Math.ceil(src.byteLength / 4) * 4);
  const staged = new Uint8Array(padded);
  staged.set(new Uint8Array(src));
  if (rawBuf) rawBuf.destroy();
  rawBuf = device.createBuffer({ size: padded, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(rawBuf, 0, staged, 0, padded);
  st.srcBytes = src.byteLength;
}

/* ---- one extraction + reduction ---------------------------------------- */
function cfgFor(patch){
  const c = { ...st.base, ...patch };
  c.schema = patch.schema || st.base.schema;
  return c;
}
function maxLaneEnd(schema){
  let e = 0;
  const SZ = { [LANE.u8]:1, [LANE.i8]:1, [LANE.nibLo]:1, [LANE.nibHi]:1, [LANE.snibLo]:1, [LANE.snibHi]:1,
               [LANE.fp8e4m3]:1, [LANE.fp8e5m2]:1, [LANE.u16]:2, [LANE.i16]:2, [LANE.fp16]:2, [LANE.bf16]:2,
               [LANE.u32]:4, [LANE.i32]:4, [LANE.fp32]:4 };
  for (const l of schema.lanes) e = Math.max(e, l.off + (SZ[l.t] || 1));
  return e;
}

const epBuf = new ArrayBuffer(96);
const epU = new Uint32Array(epBuf), epF = new Float32Array(epBuf);

// A chunked extract needs the uniform to change between dispatches, and a
// single encoder cannot do that -- the dispatches would all read whatever the
// buffer held at submit time. So chunks are submitted one at a time.
async function runExtract(bitBuf, cfg, writeExtras){
  const sch = cfg.schema;
  const stride = Math.max(1, sch.stride | 0);
  const tail = maxLaneEnd(sch);
  const avail = st.srcBytes - cfg.startByte - tail;
  const tuples = avail > 0 ? Math.floor(avail / stride) + 1 : 0;

  const clr = device.createCommandEncoder();
  clr.clearBuffer(bitBuf);
  if (writeExtras){ clr.clearBuffer(cntBuf); clr.clearBuffer(sliceBuf); }
  device.queue.submit([clr.finish()]);
  if (tuples <= 0) return 0;

  const bg = device.createBindGroup({ layout: extractBGL, entries: [
    { binding:0, resource:{ buffer: rawBuf } },
    { binding:1, resource:{ buffer: bitBuf } },
    { binding:2, resource:{ buffer: cntBuf } },
    { binding:3, resource:{ buffer: sliceBuf } },
    { binding:4, resource:{ buffer: extractUBO } },
  ]});
  const span = Math.max(1, st.srcBytes - cfg.startByte);
  const sliceShift = Math.max(0, Math.ceil(Math.log2(span / SLICES)));
  const MAXD = 65535 * WG;

  let done = 0;
  while (done < tuples){
    const n = Math.min(tuples - done, MAXD);
    epU[0] = stride; epU[1] = n; epU[2] = cfg.startByte; epU[3] = st.B;
    epU[4] = sch.lanes[0].off; epU[5] = sch.lanes[1].off; epU[6] = sch.lanes[2].off; epU[7] = 0;
    epU[8] = sch.lanes[0].t;  epU[9] = sch.lanes[1].t;  epU[10] = sch.lanes[2].t; epU[11] = 0;
    epF[12] = cfg.gain; epU[13] = cfg.compand; epF[14] = cfg.compandParam; epU[15] = cfg.isLE ? 1 : 0;
    epU[16] = sliceShift; epU[17] = cfg.startByte; epU[18] = writeExtras ? 1 : 0; epU[19] = done;
    device.queue.writeBuffer(extractUBO, 0, epBuf);

    const enc = device.createCommandEncoder();
    const p = enc.beginComputePass();
    p.setPipeline(extractPipe); p.setBindGroup(0, bg);
    p.dispatchWorkgroups(Math.ceil(n / WG));
    p.end();
    device.queue.submit([enc.finish()]);
    done += n;
    if (done < tuples) await device.queue.onSubmittedWorkDone();
  }
  return tuples;
}

const rpBuf = new Uint32Array(UBO_SLOT / 4 * REDUCE_SLOTS);
// Several reductions share one encoder, so each must own a distinct slot range
// in the uniform buffer -- otherwise the later writeBuffer clobbers the earlier
// one and every recorded dispatch reads the last set of parameters.
function reduceInto(enc, buf, pipe, lay, B, kind, slotBase){
  const bg = device.createBindGroup({ layout: reduceBGL, entries: [
    { binding:0, resource:{ buffer: buf } },
    { binding:1, resource:{ buffer: reduceUBO, size: 16 } },
  ]});
  const jobs = [];
  let slot = slotBase;
  for (let l = B - 1; l >= 1; l--){
    const parents = Math.pow(8, l);
    const base = slot * (UBO_SLOT / 4);
    rpBuf[base + 0] = lay.off[l];
    rpBuf[base + 1] = lay.off[l + 1];
    rpBuf[base + 2] = parents;
    rpBuf[base + 3] = kind === "bits" ? lay.words[l + 1] : parents * 8;
    jobs.push({ slot, threads: kind === "bits" ? Math.ceil(parents / 32) : parents });
    slot++;
  }
  if (jobs.length){
    device.queue.writeBuffer(reduceUBO, slotBase * UBO_SLOT, rpBuf,
                             slotBase * (UBO_SLOT / 4), jobs.length * (UBO_SLOT / 4));
  }
  for (const j of jobs){
    const p = enc.beginComputePass();
    p.setPipeline(pipe);
    p.setBindGroup(0, bg, [j.slot * UBO_SLOT]);
    p.dispatchWorkgroups(Math.max(1, Math.ceil(j.threads / WG)));
    p.end();
  }
  return slot;
}

async function buildRow(row, withExtras){
  await runExtract(row.buf, row.cfg, withExtras);
  const enc = device.createCommandEncoder();
  let slot = reduceInto(enc, row.buf, reduceBitsPipe, bitLay, st.B, "bits", 0);
  if (withExtras){
    const EB = Math.min(st.B, EXTRAS_MAXB);
    slot = reduceInto(enc, cntBuf,   reduceMaxPipe, extLay, EB, "ext", slot);
    slot = reduceInto(enc, sliceBuf, reduceOrPipe,  extLay, EB, "ext", slot);
    enc.copyBufferToBuffer(cntBuf, extLay.off[1] * 4, readbackBuf, 0, 32);
  }
  device.queue.submit([enc.finish()]);
  if (withExtras){
    await readbackBuf.mapAsync(GPUMapMode.READ);
    const v = new Uint32Array(readbackBuf.getMappedRange().slice(0));
    readbackBuf.unmap();
    st.maxCount = Math.max(1, ...v.slice(0, 8));
  }
}

/* ---- rebuild the sheet -------------------------------------------------- */
async function rebuild(){
  if (st.building) return;
  st.building = true;
  const t0 = performance.now();
  if (!st.corpus) await makeCorpus();

  const { bitBytes } = allocFields();
  const sweep = SWEEPS[st.sweepIdx];
  // an occupancy field costs 8^B/8 bytes plus the 1/7 pyramid, so at B=10 a
  // row is 153 MiB and the sheet has to shrink to fit
  const maxRows = Math.max(1, Math.min(MAX_ROWS, Math.floor(ROW_BUDGET / bitBytes)));
  const all = sweep.build(st.base);
  let variants = all.slice(0, maxRows);
  if (all.length > variants.length)
    toast(`${all.length - variants.length} row(s) dropped — ${bytesStr(bitBytes)} each at B=${st.B}`);

  st.rows = variants.map(v => ({
    label: v.label, cfg: cfgFor(v.patch),
    buf: device.createBuffer({ size: bitBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST }),
    tuples: 0
  }));

  for (let i = 0; i < st.rows.length; i++){
    setBusy(`extracting ${sweep.name} ${i + 1}/${st.rows.length}\nB=${st.B}  ${bytesStr(bitBytes)} each`);
    if (i % 3 === 0) await yieldFrame();
    st.rows[i].tuples = await buildRow(st.rows[i], false) || 0;
  }
  st.extraRow = -1;

  renderBGs = st.rows.map(r => device.createBindGroup({ layout: renderBGL, entries: [
    { binding:0, resource:{ buffer: renderUBO, size: UBO_SLOT } },
    { binding:1, resource:{ buffer: r.buf } },
    { binding:2, resource:{ buffer: cntBuf } },
    { binding:3, resource:{ buffer: sliceBuf } },
  ]}));

  st.ROWS = st.rows.length;
  st.COLS = Math.max(1, st.B - st.LMIN + 1);
  if (st.sel && (st.sel.r >= st.ROWS || st.sel.c >= st.COLS)) st.sel = null;
  if (st.zoom && (st.zoom.r >= st.ROWS || st.zoom.c >= st.COLS)) st.zoom = null;
  st.buildMs = performance.now() - t0;
  setBusy(null);
  st.building = false;
  layout(); paintHud();
  if (st.zoom) ensureExtras(st.zoom.r);
}

// counts + slice masks exist for one row at a time: 64 MiB each is affordable
// once, not eight times. Entering the isolated view builds them for that row.
async function ensureExtras(rowIdx){
  if (st.building || rowIdx < 0 || rowIdx >= st.rows.length) return;
  if (st.extraRow === rowIdx) return;
  if (st.B > EXTRAS_MAXB){ st.extraRow = -1; return; }
  st.building = true;
  setBusy("building density + slice pyramids");
  await yieldFrame();
  await buildRow(st.rows[rowIdx], true);
  st.extraRow = rowIdx;
  setBusy(null);
  st.building = false;
  syncThreshold();
  paintHud();
}

/* ---- layout ------------------------------------------------------------- */
const GUT_L = 112, GUT_T = 26, PAD = 10, GAP = 3, BAR_H = 56;
let dpr = 1, cell = 60;
const labels = el("labels"), selBox = el("sel");

function layout(){
  const W = innerWidth, H = innerHeight - BAR_H;
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  const cw = Math.max(1, Math.round(W * dpr)), ch = Math.max(1, Math.round(H * dpr));
  if (canvas.width !== cw || canvas.height !== ch){ canvas.width = cw; canvas.height = ch; }
  if (!st.ROWS){ labels.innerHTML = ""; return; }
  cell = Math.max(28, Math.floor(Math.min((W - GUT_L - PAD) / st.COLS, (H - GUT_T - PAD) / st.ROWS)));

  if (st.zoom){
    const r = st.rows[st.zoom.r], L = st.LMIN + st.zoom.c;
    labels.innerHTML =
      `<div class="lbl col" style="left:0;top:8px;width:${W}px;text-align:center">` +
      `<span style="color:#b8b8cc">${st.corpusName} · ${r.label}</span>` +
      `<span style="color:#4c4c5c"> — depth ${L}, ${1 << L}³</span></div>` +
      `<div class="lbl col" style="left:0;bottom:8px;width:${W}px;text-align:center;color:#3e3e4c">` +
      `click or esc to return &nbsp;·&nbsp; arrows to move &nbsp;·&nbsp; drag to orbit</div>`;
    selBox.style.display = "none"; canvas.style.cursor = "zoom-out";
    return;
  }
  canvas.style.cursor = "zoom-in";
  const out = [];
  for (let c = 0; c < st.COLS; c++){
    const L = st.LMIN + c;
    out.push(`<div class="lbl col" style="left:${GUT_L + c*cell}px;top:5px;width:${cell}px;` +
             `text-align:center;overflow:hidden">d=${L}<br><span style="color:#4c4c5c">${1 << L}³` +
             `${L === st.B ? " leaf" : ""}</span></div>`);
  }
  for (let r = 0; r < st.ROWS; r++){
    const row = st.rows[r];
    out.push(`<div class="lbl row" style="left:0;top:${GUT_T + r*cell + cell/2 - 12}px;` +
             `width:${GUT_L - 8}px">${row.label}<br>` +
             `<span style="color:#4c4c5c">${numStr(row.tuples)} tuples</span><br>` +
             `<span style="color:#3e3e4c">/${row.cfg.schema.stride}B</span></div>`);
  }
  labels.innerHTML = out.join("");
}
const cellRect = (r, c) => ({ x: GUT_L + c*cell, y: GUT_T + r*cell, w: cell - GAP, h: cell - GAP });
function zoomRect(){
  const W = innerWidth, H = innerHeight - BAR_H;
  const side = Math.max(64, Math.min(W - 2*PAD, H - GUT_T - 3*PAD));
  return { x: (W - side)/2, y: GUT_T + (H - GUT_T - side)/2, w: side, h: side };
}
function pick(mx, my){
  if (!st.ROWS) return null;
  const c = Math.floor((mx - GUT_L) / cell), r = Math.floor((my - GUT_T) / cell);
  return (r >= 0 && r < st.ROWS && c >= 0 && c < st.COLS) ? { r, c } : null;
}

/* ---- planes (slab / cutaway) as integer half-spaces --------------------- */
const PLANE_SCALE = 512;
function activePlanes(){
  const P = [];
  if (st.cut) P.push([-PLANE_SCALE, -PLANE_SCALE, -PLANE_SCALE, -Math.round(PLANE_SCALE * 0.02)]);
  if (st.slab){
    const n = [[1,0,0],[0,1,0],[0,0,1]][st.slabAxis];
    const h = st.slabThick * 0.5;
    P.push([ Math.round(n[0]*PLANE_SCALE),  Math.round(n[1]*PLANE_SCALE),  Math.round(n[2]*PLANE_SCALE),
             Math.round((st.slabPos + h) * PLANE_SCALE) ]);
    P.push([ -Math.round(n[0]*PLANE_SCALE), -Math.round(n[1]*PLANE_SCALE), -Math.round(n[2]*PLANE_SCALE),
             Math.round((h - st.slabPos) * PLANE_SCALE) ]);
  }
  return P.slice(0, MAX_PLANES);
}

/* ---- draw --------------------------------------------------------------- */
const RU_FLOATS = UBO_SLOT / 4;
const ruArr = new ArrayBuffer(UBO_SLOT * MAX_ROWS * 12);
const ruF = new Float32Array(ruArr), ruI = new Int32Array(ruArr), ruU = new Uint32Array(ruArr);

function writeRU(slot, rect, level, aa, extrasOn){
  const b = slot * RU_FLOATS;
  const cam = camBasis();
  ruF[b+0] = cam.pos[0]; ruF[b+1] = cam.pos[1]; ruF[b+2] = cam.pos[2];
  ruF[b+4] = cam.f[0];   ruF[b+5] = cam.f[1];   ruF[b+6] = cam.f[2];
  ruF[b+8] = cam.r[0];   ruF[b+9] = cam.r[1];   ruF[b+10] = cam.r[2];
  ruF[b+12] = cam.u[0];  ruF[b+13] = cam.u[1];  ruF[b+14] = cam.u[2];
  const vx = Math.round(rect.x * dpr), vy = Math.round(rect.y * dpr);
  const vw = Math.max(1, Math.round(rect.w * dpr)), vh = Math.max(1, Math.round(rect.h * dpr));
  ruF[b+16] = vw; ruF[b+17] = vh; ruF[b+18] = vx; ruF[b+19] = vy;
  const EB = Math.min(st.B, EXTRAS_MAXB);
  ruI[b+20] = level; ruI[b+21] = extrasOn ? 1 : 0; ruI[b+22] = Math.min(level, EB); ruI[b+23] = st.palette;
  const planes = activePlanes();
  ruI[b+24] = st.ao ? 1 : 0; ruI[b+25] = st.steps[st.quality]; ruI[b+26] = planes.length; ruI[b+27] = aa;
  ruU[b+28] = st.threshold; ruU[b+29] = windowMask(); ruU[b+30] = 0; ruU[b+31] = 0;
  for (let i = 0; i < 12; i++) ruU[b + 32 + i] = bitLay.off[i] || 0;
  for (let i = 0; i < 12; i++) ruU[b + 44 + i] = extLay.off[i] || 0;
  for (let i = 0; i < MAX_PLANES; i++){
    const p = planes[i] || [0,0,0,0];
    ruI[b + 56 + i*4 + 0] = p[0]; ruI[b + 56 + i*4 + 1] = p[1];
    ruI[b + 56 + i*4 + 2] = p[2]; ruI[b + 56 + i*4 + 3] = p[3];
  }
  return { vx, vy, vw, vh };
}
function windowMask(){
  let m = 0;
  for (let i = 0; i < st.winB; i++) m |= 1 << ((st.winA + i) % SLICES);
  return m >>> 0;
}

function draw(){
  if (!device || !st.ROWS || st.building) return;
  const jobs = [];
  let slot = 0;
  if (st.zoom){
    const vp = writeRU(slot, zoomRect(), st.LMIN + st.zoom.c, 2, st.extraRow === st.zoom.r);
    jobs.push({ slot, row: st.zoom.r, vp }); slot++;
  } else {
    for (let r = 0; r < st.ROWS; r++)
      for (let c = 0; c < st.COLS; c++){
        const vp = writeRU(slot, cellRect(r, c), st.LMIN + c, 1, false);
        jobs.push({ slot, row: r, vp }); slot++;
      }
  }
  device.queue.writeBuffer(renderUBO, 0, ruArr, 0, slot * UBO_SLOT);

  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{
    view: ctx.getCurrentTexture().createView(),
    clearValue: { r:0.024, g:0.024, b:0.036, a:1 }, loadOp:"clear", storeOp:"store" }]});
  pass.setPipeline(renderPipe);
  // WebGPU viewport coords are top-left origin, the same frame @builtin(position)
  // reports in, so the shader can rebase fragCoord by subtracting (vx, vy)
  const W = canvas.width, H = canvas.height;
  for (const j of jobs){
    const { vx, vy, vw, vh } = j.vp;
    if (vw < 1 || vh < 1 || vx < 0 || vy < 0 || vx + vw > W || vy + vh > H) continue;
    pass.setViewport(vx, vy, vw, vh, 0, 1);
    pass.setBindGroup(0, renderBGs[j.row], [j.slot * UBO_SLOT]);
    pass.draw(3);
  }
  pass.end();
  device.queue.submit([enc.finish()]);
}

/* ---- hud ---------------------------------------------------------------- */
function paintHud(){
  const R = [];
  const sweep = SWEEPS[st.sweepIdx];
  R.push("<span class='sec'>--- SOURCE ---</span>");
  R.push("corpus".padEnd(10) + (st.corpusName || "-").slice(0,17).padEnd(17) + "c");
  R.push("size".padEnd(10) + bytesStr(st.srcBytes).padEnd(17) + "n");
  R.push("");
  R.push("<span class='sec'>--- SHEET ---</span>");
  R.push("rows".padEnd(10) + sweep.name.padEnd(17) + "a");
  R.push("grid".padEnd(10) + `${st.ROWS} × ${st.COLS}`.padEnd(17));
  R.push("schema".padEnd(10) + st.base.schema.name.padEnd(17) + "w");
  R.push("bits/axis".padEnd(10) + `${st.B} (${1 << st.B}³)`.padEnd(17) + "-/=");
  R.push("depths".padEnd(10) + `${st.LMIN}..${st.B}`.padEnd(17) + "[/]");
  R.push("endian".padEnd(10) + (st.base.isLE ? "little" : "big").padEnd(17) + "i");
  R.push("build".padEnd(10) + (st.buildMs.toFixed(0) + " ms").padEnd(17) + "r");
  const per = bitLay.total * 4;
  R.push("occupancy".padEnd(10) + `${bytesStr(per)} ×${st.ROWS}`.padEnd(17));
  R.push("extras".padEnd(10) + (st.B > EXTRAS_MAXB ? "off (B>8)" : bytesStr(extLay.total * 8)).padEnd(17));
  R.push("");
  R.push("<span class='sec'>--- FILTER ---</span>");
  if (st.extraRow >= 0){
    R.push("<span class='ok'>live on " + st.rows[st.extraRow].label + "</span>");
    R.push("threshold".padEnd(10) + `≥ ${numStr(st.threshold)}`.padEnd(17));
    R.push("peak".padEnd(10) + numStr(st.maxCount).padEnd(17));
    R.push("window".padEnd(10) + `${st.winA}..${(st.winA + st.winB - 1) % SLICES} /32`.padEnd(17));
  } else {
    R.push("<span class='sec'>isolate a cell to enable</span>");
    R.push("<span class='sec'>threshold + window scrub</span>");
  }
  R.push("");
  R.push("<span class='sec'>--- VIEW ---</span>");
  R.push("palette".padEnd(10) + ["value","file slice","density","addr hash","march cost","plain"][st.palette].padEnd(17) + "k");
  R.push("ao".padEnd(10) + (st.ao ? "on" : "off").padEnd(17) + "l");
  R.push("slab".padEnd(10) + (st.slab ? "on" : "off").padEnd(17) + "s");
  R.push("cutaway".padEnd(10) + (st.cut ? "on" : "off").padEnd(17) + "x");
  R.push("steps".padEnd(10) + String(st.steps[st.quality]).padEnd(17) + "q");
  R.push("orbit".padEnd(10) + (autoOrbit ? "auto" : "hold").padEnd(17) + "space");
  R.push("png".padEnd(10) + "".padEnd(17) + "y");
  el("hud").innerHTML = R.join("\n") + "\n\n<b>" + st.fps + " fps</b>";
}

/* ---- threshold slider is log over the observed peak --------------------- */
function syncThreshold(){
  const f = st.thrRaw / 100;
  st.threshold = Math.max(1, Math.round(Math.pow(st.maxCount, f)));
  el("vThr").textContent = "≥ " + numStr(st.threshold);
}

/* ---- input -------------------------------------------------------------- */
let drag = null;
canvas.addEventListener("pointerdown", ev => {
  if (ev.button !== 0) return;
  drag = { x:ev.clientX, y:ev.clientY, moved:false, th:camTheta, ph:camPhi };
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener("pointermove", ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.hypot(dx, dy) > 4) drag.moved = true;
  camTheta = drag.th + dx * 0.006;
  camPhi = Math.max(0.08, Math.min(Math.PI - 0.08, drag.ph - dy * 0.006));
});
const endDrag = () => { drag = null; };
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("wheel", ev => {
  camRadius = Math.max(1.6, Math.min(12, camRadius * (1 + ev.deltaY * 0.0012)));
}, { passive:true });

canvas.addEventListener("click", ev => {
  if (drag && drag.moved) return;
  if (st.zoom){ st.zoom = null; layout(); paintHud(); return; }
  const p = pick(ev.clientX, ev.clientY);
  if (p){ st.zoom = { ...p }; st.sel = { ...p }; layout(); paintHud(); ensureExtras(p.r); }
});
addEventListener("mousemove", ev => {
  if (drag || st.zoom || !st.ROWS) return;
  const p = pick(ev.clientX, ev.clientY);
  if (p && (!st.sel || st.sel.r !== p.r || st.sel.c !== p.c)){
    const q = cellRect(p.r, p.c);
    selBox.style.cssText = `display:block;left:${q.x}px;top:${q.y}px;width:${q.w}px;height:${q.h}px`;
    st.sel = { ...p }; paintHud();
  } else if (!p && st.sel){ st.sel = null; selBox.style.display = "none"; paintHud(); }
});

addEventListener("keydown", ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey || st.building) return;
  if (/^(INPUT|TEXTAREA)$/.test((ev.target && ev.target.tagName) || "")) return;
  const k = ev.key;
  if (k === "Escape"){ if (st.zoom){ st.zoom = null; layout(); paintHud(); } return; }
  if (k.startsWith("Arrow") && st.ROWS){
    ev.preventDefault();
    const b = st.zoom || st.sel || { r:0, c:0 };
    const r = (b.r + (k === "ArrowDown") - (k === "ArrowUp") + st.ROWS) % st.ROWS;
    const c = (b.c + (k === "ArrowRight") - (k === "ArrowLeft") + st.COLS) % st.COLS;
    st.sel = { r, c };
    if (st.zoom){ st.zoom = { r, c }; layout(); ensureExtras(r); }
    else { const q = cellRect(r, c);
           selBox.style.cssText = `display:block;left:${q.x}px;top:${q.y}px;width:${q.w}px;height:${q.h}px`; }
    paintHud(); return;
  }
  if (k === " "){ ev.preventDefault(); autoOrbit = !autoOrbit; paintHud(); return; }
  switch (k){
    case "c": st.corpusIdx = (st.corpusIdx + 1) % CORPUS_NAMES.length; st.corpus = null; rebuild(); return;
    case "n": st.seed = (st.seed + 1) & 0xffff; st.corpus = null; rebuild(); return;
    case "a": st.sweepIdx = (st.sweepIdx + 1) % SWEEPS.length; rebuild(); return;
    case "w": {
      const i = SCHEMAS.indexOf(st.base.schema);
      st.base.schema = SCHEMAS[(i + 1) % SCHEMAS.length]; rebuild(); return;
    }
    case "i": st.base.isLE = !st.base.isLE; rebuild(); return;
    case "-": case "_": if (st.B > Math.max(st.LMIN, 3)){ st.B--; rebuild(); } return;
    case "=": case "+": if (st.B < 10){ st.B++; rebuild(); } return;
    case "[": if (st.LMIN > 1){ st.LMIN--; st.COLS = st.B - st.LMIN + 1; layout(); paintHud(); } return;
    case "]": if (st.LMIN < st.B){ st.LMIN++; st.COLS = st.B - st.LMIN + 1; layout(); paintHud(); } return;
    case "r": st.corpus = null; rebuild(); return;
    case "k": st.palette = (st.palette + 1) % 6; paintHud(); return;
    case "l": st.ao = !st.ao; paintHud(); return;
    case "s": st.slab = !st.slab; paintHud(); return;
    case "x": st.cut = !st.cut; paintHud(); return;
    case "q": st.quality = (st.quality + 1) % st.steps.length; paintHud(); return;
    case "y": exportPNG(); return;
  }
});
addEventListener("resize", () => layout());

function exportPNG(){
  canvas.toBlob(b => {
    if (!b) return toast("png encode failed");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = `bitfield_${new Date().toISOString().replace(/[:.]/g,"-").slice(0,19)}.png`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }, "image/png");
}

/* ---- bar sliders: all render-time, none re-extract ---------------------- */
el("sWinA").oninput = e => { st.winA = +e.target.value;
  el("vWinA").textContent = Math.round(st.winA / SLICES * 100) + "%"; };
el("sWinB").oninput = e => { st.winB = +e.target.value;
  el("vWinB").textContent = st.winB >= SLICES ? "all" : st.winB + "/32"; };
el("sThr").oninput  = e => { st.thrRaw = +e.target.value; syncThreshold(); };
el("sGain").oninput = e => {
  st.base.gain = Math.pow(2, +e.target.value);
  el("vGain").textContent = st.base.gain >= 1 ? String(st.base.gain) : st.base.gain.toFixed(3);
  clearTimeout(el("sGain")._k);
  el("sGain")._k = setTimeout(() => rebuild(), 220);         // gain IS an extraction param
};

/* ---- file ingest -------------------------------------------------------- */
const dropEl = el("drop");
addEventListener("dragover", e => { e.preventDefault(); dropEl.style.display = "block"; });
addEventListener("dragleave", () => { dropEl.style.display = "none"; });
addEventListener("drop", async e => {
  e.preventDefault(); dropEl.style.display = "none";
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  setBusy(`reading ${f.name}\n${bytesStr(f.size)}`);
  st.corpus = await f.arrayBuffer();
  st.corpusName = f.name;
  uploadCorpus();
  rebuild();
});

/* ---- loop --------------------------------------------------------------- */
let last = performance.now(), acc = 0, frames = 0;
function frame(now){
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (autoOrbit && !drag) orbitT += dt;
  draw();
  acc += dt; frames++;
  if (acc >= 0.5){ st.fps = Math.round(frames / acc); acc = 0; frames = 0; paintHud(); }
  requestAnimationFrame(frame);
}

(async () => {
  if (!(await initGPU())) return;
  layout();
  await rebuild();
  syncThreshold();
  requestAnimationFrame(frame);
})();
</script>
</body>
