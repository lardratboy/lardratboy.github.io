    let done = false;
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      done = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (_){ done = false; }
    done ? onDone() : onFail();
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(onDone, fallback);
  else fallback();
}
function download(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* Voxel count is the PRODUCT of the per-level popcounts.  It collapses to k^L
   only when every level keeps the same number of sub-cells, which is true for
   the depth modes here but not for a hand-written or imported stack.         */
function voxelCount(rules, L){
  let v = 1;
  for (let l = 0; l < L; l++) v *= popcount(stackMask(rules, l));
  return v;
}

/* ---- numbers for the HUD -------------------------------------------------- */
function bigNum(x){
  if (!Number.isFinite(x)) return "inf";
  if (x < 1e7) return Math.round(x).toLocaleString("en-US");
  return x.toExponential(3);
}
const dimOf = k => (k > 0 ? Math.log(k) / LOG_RADIX : 0);

/* ================== TOWER CORE (pure) END ======================== */

/* ================================= HOST =================================== */
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias:false, alpha:false, depth:false,
                                         preserveDrawingBuffer:true });

function compile(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(sh));
    console.error(src.split("\n").map((l, i) => (i + 1) + "| " + l).join("\n"));
    return null;
  }
  return sh;
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.opacity = "1";
  clearTimeout(t._timer); t._timer = setTimeout(() => { t.style.opacity = "0"; }, 2100);
}

function link(fragSrc){
  const vs = compile(gl.VERTEX_SHADER, VERT), fs = compile(gl.FRAGMENT_SHADER, fragSrc);
  if (!vs || !fs) return null;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(prog)); return null; }
  return prog;
}

/* Every uniform location the row binding needs, for one program. The probes
   look theirs up the same way, so a misnamed uniform is a null for every
   program alike rather than a difference between them.                    */
function uniformsOf(prog){
  const at = name => gl.getUniformLocation(prog, name);
  return {
    prog,
    res: at("iResolution"), origin: at("uOrigin"),
    eye: at("uEye"), forward: at("uForward"), right: at("uRight"), up: at("uUp"),
    rules: at("uRules[0]"), levels: at("uLevels"), steps: at("uSteps"),
    planes: at("uPlanes[0]"), planeCount: at("uPlaneCount"),
    graphKeep: at("uGraphKeep[0]"), graphNext: at("uGraphNext[0]"), graphStates: at("uGraphStates"),
    brickBits: at("uBrickBits"), brickNext: at("uBrickNext"), solidTail: at("uSolidTail[0]"),
    probeCells: at("uProbeCells")
  };
}

function main(){
  const prog = link(FRAG);
  if (!prog) return;
  gl.useProgram(prog);
  gl.bindVertexArray(gl.createVertexArray());
  const U = uniformsOf(prog);
  gl.uniform1i(U.brickBits, 0);
  gl.uniform1i(U.brickNext, 1);

  function wordTexture(width, height, words){
    const texture = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32UI, width, height, 0,
                  gl.RED_INTEGER, gl.UNSIGNED_INT, words);
    return texture;
  }
  const EMPTY_WORD_TEXTURE = wordTexture(1, 1, new Uint32Array(1));
  const EMPTY_BRICKS = { bits: EMPTY_WORD_TEXTURE, next: EMPTY_WORD_TEXTURE };
  function uploadBricks(compiled){
    return {
      bits: wordTexture(BRICK_WORDS, compiled.height, compiled.bits),
      next: compiled.next
        ? wordTexture(BRICK_NEXT_WORDS, compiled.height, compiled.next)
        : EMPTY_WORD_TEXTURE
    };
  }
  function deleteBricks(bricks){
    if (!bricks || bricks === EMPTY_BRICKS) return;
    gl.deleteTexture(bricks.bits);
    if (bricks.next !== EMPTY_WORD_TEXTURE) gl.deleteTexture(bricks.next);
  }

  const hud    = document.getElementById("hud");
  const labels = document.getElementById("labels");
  const selBox = document.getElementById("sel");
  const menu   = document.getElementById("menu");

  const AXIS_NAMES = ["shell subsets", "Td tetrahedra", "convex polyhedra",
                      "graph-directed", "symmetry groups", "seed scan"];
  const ZERO_PLANES = new Int32Array(MAXPLANES * 4);
  const ZERO_KEEP   = new Uint32Array(MAXSTATES * 2);
  const ZERO_NEXT   = new Uint32Array(MAXSTATES * 8);
  const DENSITIES  = [0.12, 0.22, 0.33, 0.44, 0.55, 0.74];
  // Derived from STEP_CAP so the control can never promise more than the
  // shader loop can deliver: the top option IS the hard cap.
  const QUALITY    = [STEP_CAP / 6, STEP_CAP / 2, STEP_CAP];
  const SEED_ROWS  = 12;
  const GUTTER_L = 104, GUTTER_T = 26, PAD = 10, GAP = 3;
  const OBJ_CAP = 40000;

  let axis = 0, depthMode = 0, densityIdx = 3, fieldMode = 0;
  // LMAX 5 is side 1024, the nearest radix-4 match to v3's default (L=6, side 729).
  let g48 = 0, seed = 42, LMIN = 1, LMAX = 5, qualityIdx = 1;
  let running = true;
  let dpr = 1, cell = 60, fps = 0, buildMs = 0;
  let sel = null, zoom = null, imported = null;
  let rows = [], ROWS = 0, COLS = 6;

  const camera = new PushThroughCamera();
  const pointers = new Map();
  let gestureMoved = false;

  /* ---- rows ------------------------------------------------------------- */
  // the 15 non-empty Oh-invariant shell subsets, heaviest first
  const SHELL_ROWS = Array.from({ length: 16 }, (_, s) => s)
    .filter(s => s !== 0)
    .map(s => ({ sub:s, k:[0,1,2,3].reduce((a, i) => a + ((s >> i & 1) ? SHELL_SIZES[i] : 0), 0) }))
    .sort((a, b) => b.k - a.k || a.sub - b.sub);

  function buildRows(){
    const t0 = performance.now();
    const pars = conicParams(seed);
    const want = Math.max(1, Math.round(DENSITIES[densityIdx] * DIGITS));
    for (const r of rows) deleteBricks(r.bricks);
    rows = [];
    if (axis === 0){
      for (const r of SHELL_ROWS){
        const base = ruleFromShells(r.sub);
        rows.push({ label: shellLabel(r.sub), sub: r.sub, base,
                    note: `k=${popcount(base)}` });
      }
    } else if (axis === 1){
      for (const r of TD_RULES)
        rows.push({ label: tdLabel(r.base), base: r.base, note: `k=${r.k}` });
    } else if (axis === 2){
      for (const poly of POLYHEDRA)
        rows.push({ label: poly.name, base: [0, 0], planes: poly.planes,
                    note: `${poly.planes.length} planes` });
    } else if (axis === 3){
      for (const g of GRAPH_SYSTEMS)
        rows.push({ label: g.label, base: [0, 0], graph: g.states, graphMeta: g,
                    note: `\u03bb=${g.lam.toFixed(3)}` });
    } else if (axis === 4){
      for (let gi = 0; gi < GROUPS.length; gi++){
        const base = ruleForGroup(gi, fieldMode, seed, DENSITIES[densityIdx], g48, pars);
        rows.push({ label: GROUPS[gi].name, base, groupIdx: gi,
                    note: `|G|=${GROUPS[gi].order}${GROUPS[gi].chiral ? " chiral" : ""}` });
      }
    } else {
      for (let i = 0; i < SEED_ROWS; i++){
        const base = ruleRandom(seed, i, want);
        rows.push({ label: `#${seed}.${i}`, base, note: `k=${popcount(base)}` });
      }
    }
    for (const r of rows){
      if (r.planes){
        // a polyhedron is solid: dimension 3, and its "k" is not a popcount
        r.k = DIGITS; r.stab = 48; r.dim = 3; r.solid = true;
      } else if (r.graph){
        // growth is a transfer-matrix power, so dim = log(lambda)/log 4
        r.k = 0; r.stab = 1; r.dim = r.graphMeta.dim;
      } else {
        r.k = popcount(r.base);
        r.stab = stabOrder(r.base);
        r.dim = dimOf(r.k);
      }
      r.stacks = [];
      // all 64 bits at every level: the rule stack passes everything
      for (let L = LMIN; L <= LMAX; L++)
        r.stacks.push((r.planes || r.graph)
          ? new Uint32Array(2 * MAXL).fill(0xffffffff)
          : rulesFor(r.base, depthMode, L, g48, seed));
      r.voxelCounts = r.stacks.map((rules, c) => hudVoxelCount(r, LMIN + c, rules));
      r.solidTails = [];
      r.stacks.forEach((rules, c) => { r.solidTails[LMIN + c] = solidTails(rules, LMIN + c, r.graph); });
      // Every shorter rule stack is a prefix of the deepest stack, so one
      // texture serves all columns in this row. Graph rows index by state.
      r.bricks = r.planes ? EMPTY_BRICKS : uploadBricks(r.graph
        ? compileGraphBricks(r.graph)
        : compileRuleBricks(r.stacks[r.stacks.length - 1], LMAX));
      r.graphPacked = r.graph ? packGraph(r.graph) : null;
      r.planesPacked = r.planes ? packPlanes(r.planes) : null;
      // A depth transform can only move a rule that its group element does not
      // already fix, so it is inert exactly when g48 lies in the stabiliser.
      // Every shell subset has stabiliser 48, hence the whole shells axis is
      // inert under all depth modes -- worth saying rather than looking broken.
      const deep = r.stacks[r.stacks.length - 1];
      r.inert = (r.planes || r.graph)
        ? true                       // occupancy comes from the automaton, not the stack
        : Array.from({ length: LMAX }, (_, l) => maskEq(stackMask(deep, l), r.base)).every(Boolean);
    }
    ROWS = rows.length;
    COLS = LMAX - LMIN + 1;
    buildMs = performance.now() - t0;
    if (sel && (sel.r >= ROWS || sel.c >= COLS)) sel = null;
    if (zoom && (zoom.r >= ROWS || zoom.c >= COLS)) zoom = null;
  }
  const levelOf = c => LMIN + c;
  // L=1 is the 4^3 node, the binary bimoblock (2^3 of 2^3s); L=2 is one 16^3
  // brick, the unit compileRuleBrick flattens. (In v3 the bimoblock and the
  // brick were the same thing, 9^3 at L=2.)
  const scaleNote = (L, pre) => L === 1 ? pre + "bimoblock (4³ node)" : L === 2 ? pre + "brick (16³)" : "";

  /* ---- layout ----------------------------------------------------------- */
  function layout(){
    const W = innerWidth, H = innerHeight;
    cell = Math.max(28, Math.floor(Math.min((W - GUTTER_L - PAD) / COLS, (H - GUTTER_T - PAD) / ROWS)));
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    const cw = Math.round(W * dpr), ch = Math.round(H * dpr);
    if (canvas.width !== cw || canvas.height !== ch){ canvas.width = cw; canvas.height = ch; }

    if (imported){
      labels.innerHTML =
        `<div class="lbl col" style="left:0;top:8px;width:${W}px;text-align:center">` +
        `<span style="color:#b8b8cc">imported rule stack</span>` +
        `<span style="color:#4c4c5c">   L=${imported.L}   side ${Math.pow(RADIX, imported.L)}³` +
        `   ${bigNum(imported.voxels)} voxels</span></div>` +
        `<div class="lbl col" style="left:0;bottom:8px;width:${W}px;text-align:center;color:#3e3e4c">` +
        `click or esc to return to the sheet &nbsp;·&nbsp; right-click to copy or export</div>`;
      selBox.style.display = "none";
      canvas.style.cursor = "zoom-out";
      return;
    }
    if (zoom){
      const r = rows[zoom.r], L = levelOf(zoom.c);
      labels.innerHTML =
        `<div class="lbl col" style="left:0;top:8px;width:${W}px;text-align:center">` +
        `<span style="color:#b8b8cc">${r.label}</span><span style="color:#4c4c5c"> × </span>` +
        `<span style="color:#b8b8cc">L=${L}</span>` +
        `<span style="color:#4c4c5c">   ${Math.pow(RADIX, L)}³   k=${r.k}   dim ${r.dim.toFixed(4)}` +
        `   ${bigNum(r.voxelCounts[zoom.c])} voxels${scaleNote(L, "   ← ")}</span></div>` +
        `<div class="lbl col" style="left:0;bottom:8px;width:${W}px;text-align:center;color:#3e3e4c">` +
        `click or esc to return &nbsp;·&nbsp; arrows to move &nbsp;·&nbsp; right-click to export</div>`;
      selBox.style.display = "none";
      canvas.style.cursor = "zoom-out";
      return;
    }
    canvas.style.cursor = "zoom-in";

    const out = [];
    for (let c = 0; c < COLS; c++){
      const L = levelOf(c), S = Math.pow(RADIX, L);
      out.push(`<div class="lbl col" style="left:${GUTTER_L + c*cell}px;top:5px;width:${cell}px;` +
               `text-align:center;overflow:hidden">L=${L}<br><span style="color:#4c4c5c">${S}³` +
               `${L === 1 ? " bimo" : ""}</span></div>`);
    }
    for (let r = 0; r < ROWS; r++)
      out.push(`<div class="lbl row" style="left:0;top:${GUTTER_T + r*cell + cell/2 - 11}px;` +
               `width:${GUTTER_L - 8}px">${rows[r].label}<br>` +
               `<span style="color:#4c4c5c">${rows[r].note}</span><br>` +
               `<span style="color:#3e3e4c">dim ${rows[r].dim.toFixed(3)}</span></div>`);
    labels.innerHTML = out.join("");
  }

  const cellRect = (r, c) => ({ x: GUTTER_L + c*cell, y: GUTTER_T + r*cell, w: cell - GAP, h: cell - GAP });
  function zoomRect(){
    const W = innerWidth, H = innerHeight;
    const side = Math.max(64, Math.min(W - 2*PAD, H - GUTTER_T - 3*PAD));
    return { x: (W - side) / 2, y: GUTTER_T + (H - GUTTER_T - side) / 2, w: side, h: side };
  }
  function pick(mx, my){
    const c = Math.floor((mx - GUTTER_L) / cell), r = Math.floor((my - GUTTER_T) / cell);
    return (r >= 0 && r < ROWS && c >= 0 && c < COLS) ? { r, c } : null;
  }

  /* ---- shared push-through camera controls ------------------------------ */
  const restoreCursor = () => { canvas.style.cursor = (zoom || imported) ? "zoom-out" : "zoom-in"; };
  const viewHeight = () => (zoom || imported) ? zoomRect().h : innerHeight;
  function pauseOrbit(){
    if (running){ running = false; paintHud(); }
  }
  function touchPair(){
    const touches = [...pointers.values()].filter(p => p.touch);
    if (touches.length !== 2) return null;
    const [a, b] = touches;
    return { x:(a.x + b.x)/2, y:(a.y + b.y)/2, distance:Math.hypot(a.x - b.x, a.y - b.y) };
  }
  canvas.addEventListener("wheel", ev => {
    ev.preventDefault(); hideMenu(); pauseOrbit();
    const unit = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? innerHeight : 1;
    camera.dolly(ev.deltaY * unit * 0.001);
  }, { passive:false });
  canvas.addEventListener("pointerdown", ev => {
    if (ev.pointerType !== "touch" && ev.button > 2) return;
    if (ev.button === 1) ev.preventDefault();
    if (pointers.size === 0) gestureMoved = false;
    camera.pendingLog = 0;
    pointers.set(ev.pointerId, {
      x:ev.clientX, y:ev.clientY, startX:ev.clientX, startY:ev.clientY,
      touch:ev.pointerType === "touch",
      mode:ev.button === 1 ? "dolly" : (ev.button === 2 || ev.shiftKey) ? "pan" : "orbit"
    });
    if (pointers.size > 1) gestureMoved = true;
    pauseOrbit();
    canvas.setPointerCapture(ev.pointerId);
    canvas.style.cursor = "grabbing";
    paintHud();
  });
  canvas.addEventListener("pointermove", ev => {
    const p = pointers.get(ev.pointerId);
    if (!p) return;
    const before = touchPair(), dx = ev.clientX - p.x, dy = ev.clientY - p.y;
    p.x = ev.clientX; p.y = ev.clientY;
    if (Math.hypot(p.x - p.startX, p.y - p.startY) > 4) gestureMoved = true;
    if (!gestureMoved) return;
    hideMenu();
    const after = touchPair();
    if (before && after){
      if (before.distance > 0 && after.distance > 0)
        camera.dolly(Math.log(before.distance / after.distance));
      camera.pan(after.x - before.x, after.y - before.y, viewHeight());
    } else if (pointers.size === 1){
      if (p.mode === "dolly") camera.dolly(-dy * 0.005);
      else if (p.mode === "pan") camera.pan(dx, dy, viewHeight());
      else camera.orbit(dx, dy, viewHeight());
    }
  });
  function endPointer(ev){
    if (!pointers.has(ev.pointerId)) return;
    if (ev.type === "pointercancel" || ev.type === "lostpointercapture") gestureMoved = true;
    pointers.delete(ev.pointerId);
    if (canvas.hasPointerCapture?.(ev.pointerId)) canvas.releasePointerCapture(ev.pointerId);
    if (pointers.size === 0) restoreCursor();
    paintHud();
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("lostpointercapture", endPointer);
  canvas.addEventListener("auxclick", ev => { if (ev.button === 1) ev.preventDefault(); });

  canvas.addEventListener("click", ev => {
    if (gestureMoved || (ev.button !== undefined && ev.button !== 0)) return;
    hideMenu();
    if (imported){ deleteBricks(imported.bricks); imported = null; layout(); paintHud(); return; }
    if (zoom){ zoom = null; layout(); paintHud(); return; }
    const p = pick(ev.clientX, ev.clientY);
    if (p){ zoom = { r:p.r, c:p.c }; sel = { r:p.r, c:p.c }; layout(); paintHud(); }
  });

  addEventListener("mousemove", ev => {
    if (pointers.size || zoom || imported || menu.style.display === "block") return;
    const p = pick(ev.clientX, ev.clientY);
    if (p && (!sel || sel.r !== p.r || sel.c !== p.c)){
      const q = cellRect(p.r, p.c);
      selBox.style.cssText = `display:block;left:${q.x}px;top:${q.y}px;width:${q.w}px;height:${q.h}px`;
      sel = { r:p.r, c:p.c }; paintHud();
    } else if (!p && sel){ sel = null; selBox.style.display = "none"; paintHud(); }
  });

  /* ---- context menu ------------------------------------------------------ */
  function hideMenu(){ menu.style.display = "none"; }
  function copyAs(text, label){
    copyToClipboard(text, () => showToast(`${label} copied (${text.length} chars)`),
                          () => showToast(`${label} logged to console — clipboard blocked`));
  }
  function activeStack(){
    if (imported) return { rules: imported.rules, L: imported.L, label: "imported" };
    const t = zoom || sel;
    if (!t) return null;
    const r = rows[t.r], L = levelOf(t.c);
    return { rules: r.stacks[t.c], L, label: `${r.label}_L${L}`, row: r };
  }
  addEventListener("contextmenu", ev => {
    ev.preventDefault();
    if (gestureMoved) return;
    const A = activeStack();
    if (!A) return;
    const items = [
      ["copy rule stack", () => (A.row && (A.row.planes || A.row.graph))
          ? showToast("automaton rows have no rule-stack encoding")
          : copyAs(encodeStack(A.rules, A.L), "rule stack")],
      ["copy permalink",  () => (A.row && (A.row.planes || A.row.graph))
          ? showToast("automaton rows have no rule-stack encoding")
          : copyAs(permalinkFor(encodeStack(A.rules, A.L)), "permalink")],
      ["export .obj",     () => exportOBJ()],
      ["export .png",     () => exportPNG()]
    ];
    menu.innerHTML = `<div class="hdr">${A.label}</div>`;
    for (const [name, fn] of items){
      const b = document.createElement("button");
      b.textContent = name;
      b.onclick = () => { hideMenu(); fn(); };
      menu.appendChild(b);
    }
    menu.style.display = "block";
    menu.style.left = Math.min(ev.clientX, innerWidth - menu.offsetWidth - 8) + "px";
    menu.style.top  = Math.min(ev.clientY, innerHeight - menu.offsetHeight - 8) + "px";
  });
  addEventListener("pointerdown", ev => { if (!menu.contains(ev.target)) hideMenu(); }, true);

  /* ---- exports ----------------------------------------------------------- */
  const stamp = () => new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
  function exportPNG(){
    canvas.toBlob(b => {
      if (!b) return showToast("png encode failed");
      download(b, `tower_${stamp()}.png`);
      showToast(`tower_${stamp()}.png`);
    }, "image/png");
  }
  function exportOBJ(){
    const A = activeStack();
    if (!A) return showToast("hover or isolate a cell first");
    if (A.row && (A.row.planes || A.row.graph))
      return showToast("obj/permalink encode rule stacks only \u2014 this row is an automaton");
    const voxels = voxelCount(A.rules, A.L);
    if (!(voxels <= OBJ_CAP))
      return showToast(`${bigNum(voxels)} voxels exceeds the ${OBJ_CAP.toLocaleString("en-US")} cap`);
    const res = encodeOBJ(A.rules, A.L, [
      `# tower ${A.label}`,
      `# levels ${A.L}   side ${Math.pow(RADIX, A.L)}   k ${popcount(stackMask(A.rules, 0))}`,
      `# stack ${encodeStack(A.rules, A.L)}`
    ], OBJ_CAP);
    if (!res) return showToast("voxel cap hit during enumeration");
    download(new Blob([res.text], { type:"text/plain" }), `${A.label}_${stamp()}.obj`);
    showToast(`${res.voxels.toLocaleString("en-US")} voxels, ${res.quads.toLocaleString("en-US")} quads`);
  }
  function exportJSON(){
    const doc = {
      tool: "tower contact sheet r4", radix: RADIX, digitOrder: "morton octant-major",
      generated: new Date().toISOString(),
      axis: AXIS_NAMES[axis],
      levels: { min: LMIN, max: LMAX },
      shared: { depth: DEPTH_NAMES[depthMode], palette: "gamut",
                density: DENSITIES[densityIdx], field: FIELD_NAMES[fieldMode],
                g48, g48Label: formatG48(g48), seed },
      shells: { names: SHELL_CHAR, sizes: SHELL_SIZES },
      rows: rows.map(r => ({
        label: r.label, k: r.k, dimension: r.dim, baseRule: "0x" + maskHex(r.base),
        stabiliserOrder: r.stab, orbitSize: 48 / r.stab,
        levels: r.stacks.map((st, i) => {
          // counts come from the row build, so graph and polyhedron rows are
          // right too (v3 wrote k^L here, which is 0 for graph rows)
          const L = levelOf(i), voxels = r.voxelCounts[i];
          return { L, side: Math.pow(RADIX, L), voxels: Number.isFinite(voxels) ? voxels : null,
                   fill: Number.isFinite(voxels) ? voxels / Math.pow(DIGITS, L) : null,
                   stack: encodeStack(st, L) };
        })
      }))
    };
    download(new Blob([JSON.stringify(doc, null, 2)], { type:"application/json" }), `tower_${stamp()}.json`);
    showToast(`tower_${stamp()}.json — ${rows.length} rows × ${COLS} levels`);
  }

  /* ---- hud --------------------------------------------------------------- */
  function paintHud(){
    const R = [];
    R.push("<span class='sec'>--- SHEET ---</span>");
    R.push("axis".padEnd(9) + AXIS_NAMES[axis].padEnd(18) + "a");
    R.push("grid".padEnd(9) + `${ROWS} × ${COLS}`.padEnd(18));
    R.push("levels".padEnd(9) + `${LMIN}..${LMAX}`.padEnd(18) + "-/=");
    const allInert = rows.length > 0 && rows.every(r => r.inert);
    R.push("depth".padEnd(9) + DEPTH_NAMES[depthMode].padEnd(18) + "t");
    if (allInert && depthMode !== 0)
      R.push("<span class='sec'>  inert: g48 fixes every row</span>");
    if (axis === 4) R.push("field".padEnd(9) + FIELD_NAMES[fieldMode].padEnd(18) + "f");
    if (axis === 4 || axis === 5) R.push("density".padEnd(9) + DENSITIES[densityIdx].toFixed(2).padEnd(18) + "d");
    R.push("g48".padEnd(9) + formatG48(g48).padEnd(18) + "g/h");
    R.push("seed".padEnd(9) + ("#" + seed).padEnd(18) + "n/p");
    R.push("build".padEnd(9) + (buildMs.toFixed(1) + " ms").padEnd(18));
    R.push("");
    R.push("<span class='sec'>--- VIEW ---</span>");
    R.push("steps".padEnd(9) + String(QUALITY[qualityIdx]).padEnd(18) + "q");
    R.push("orbit".padEnd(9) + (pointers.size ? "drag" : running ? "run" : "hold").padEnd(18) + "space");
    R.push("<span class='sec'>left-drag: orbit · right/shift-drag: pan</span>");
    R.push("<span class='sec'>wheel / middle-drag / pinch: move through</span>");
    R.push("<span class='sec'>home / 0: reset camera</span>");
    R.push("random".padEnd(9) + "".padEnd(18) + "r");
    R.push("");
    R.push("<span class='sec'>--- EXPORT ---</span>");
    R.push(".png / .json".padEnd(27) + "y/j");
    R.push(".obj  selected".padEnd(27) + "o");
    R.push("<span class='sec'>right-click to copy stack</span>");

    const t = zoom || sel;
    if (t && rows[t.r]){
      const r = rows[t.r], L = levelOf(t.c);
      const amb = Math.pow(DIGITS, L);
      // Counts are prepared once per row build; hovering/FPS updates only read.
      const voxels = r.voxelCounts[t.c];
      R.push("");
      R.push("<span class='sec'>--- " + (zoom ? "ISOLATED" : "CELL") + " ---</span>");
      R.push(r.label + "  ×  L=" + L + scaleNote(L, "  "));
      R.push("side".padEnd(9) + `${Math.pow(RADIX, L)}³`.padEnd(18));
      if (r.planes){
        R.push("kind".padEnd(9) + "convex polyhedron".padEnd(18));
        R.push("planes".padEnd(9) + String(r.planes.length).padEnd(18));
        R.push("dim".padEnd(9) + "3 (solid)".padEnd(18));
      } else if (r.graph){
        R.push("kind".padEnd(9) + "graph-directed".padEnd(18));
        R.push("states".padEnd(9) + String(r.graph.length).padEnd(18));
        R.push("lambda".padEnd(9) + r.graphMeta.lam.toFixed(4).padEnd(18));
        R.push("dim".padEnd(9) + r.dim.toFixed(5).padEnd(18));
      } else {
        R.push("k".padEnd(9) + `${r.k}/64`.padEnd(18));
        R.push("dim".padEnd(9) + r.dim.toFixed(5).padEnd(18));
      }
      R.push("voxels".padEnd(9) + bigNum(voxels).padEnd(18));
      R.push("ambient".padEnd(9) + bigNum(amb).padEnd(18));
      R.push("fill".padEnd(9) + (Number.isFinite(voxels)
        ? (100 * voxels / amb).toFixed(3) + "%"
        : "-").padEnd(18));
      if (!r.planes && !r.graph){
        R.push("stab".padEnd(9) + `${r.stab}/48`.padEnd(18));
        R.push("orbit".padEnd(9) + `${48 / r.stab}`.padEnd(18));
      }
      if (r.inert && depthMode !== 0)
        R.push("<span class='sec'>depth inert here</span>");
      R.push("<span class='sec'>" + (zoom ? "click / esc to go back" : "click to isolate") + "</span>");
    }
    hud.innerHTML = R.join("\n") + "\n\n<b>" + fps + " fps</b>";
  }

  /* ---- input -------------------------------------------------------------- */
  function rerun(){ buildRows(); layout(); paintHud(); }
  addEventListener("keydown", ev => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const k = ev.key.toLowerCase();
    if (menu.style.display === "block" && k !== "escape") hideMenu();
    if (k === "escape"){
      hideMenu();
      if (imported){ deleteBricks(imported.bricks); imported = null; layout(); paintHud(); }
      else if (zoom){ zoom = null; layout(); paintHud(); }
      return;
    }
    if (k === "home" || k === "0"){
      ev.preventDefault(); camera.reset(); running = false; paintHud(); return;
    }
    if (imported && "atfdghnpr-=".includes(k)){
      showToast("imported stack — esc to return to the sheet");
      return;
    }
    if (k.startsWith("arrow")){
      ev.preventDefault();
      const base = zoom || sel || { r:0, c:0 };
      const dr = (k === "arrowdown") - (k === "arrowup");
      const dc = (k === "arrowright") - (k === "arrowleft");
      const r = (base.r + dr + ROWS) % ROWS, c = (base.c + dc + COLS) % COLS;
      sel = { r, c };
      if (zoom){ zoom = { r, c }; layout(); }
      else {
        const q = cellRect(r, c);
        selBox.style.cssText = `display:block;left:${q.x}px;top:${q.y}px;width:${q.w}px;height:${q.h}px`;
      }
      paintHud(); return;
    }
    if (k === " " || ev.code === "Space"){
      ev.preventDefault(); camera.pendingLog = 0; running = !running; paintHud(); return;
    }
    switch (k){
      case "a": axis = (axis + 1) % AXIS_NAMES.length; rerun(); return;
      case "t": depthMode = (depthMode + 1) % DEPTH_NAMES.length; rerun(); return;
      case "f": fieldMode = (fieldMode + 1) % FIELD_NAMES.length; rerun(); return;
      case "d": densityIdx = (densityIdx + 1) % DENSITIES.length; rerun(); return;
      case "g": g48 = (g48 + 1) % 48; rerun(); return;
      case "h": g48 = (g48 + 47) % 48; rerun(); return;
      case "n": seed = (seed + 1) & 0xffff; rerun(); return;
      case "p": seed = (seed + 0xffff) & 0xffff; rerun(); return;
      case "-": case "_":
        if (LMAX > Math.max(LMIN, 2)){ LMAX--; rerun(); } return;
      case "=": case "+":
        if (LMAX < 7){ LMAX++; rerun(); } return;
      case "q": qualityIdx = (qualityIdx + 1) % QUALITY.length; gl.uniform1i(U.steps, QUALITY[qualityIdx]); paintHud(); return;
      case "r":
        depthMode = Math.floor(Math.random() * DEPTH_NAMES.length);
        fieldMode = Math.floor(Math.random() * FIELD_NAMES.length);
        densityIdx = Math.floor(Math.random() * DENSITIES.length);
        seed = Math.floor(Math.random() * 0x10000);
        rerun(); return;
      case "y": exportPNG(); return;
      case "o": exportOBJ(); return;
      case "j": exportJSON(); return;
    }
  });
  addEventListener("resize", () => { layout(); });

  /* ---- draw --------------------------------------------------------------- */
  // one row may carry a rule stack, a polyhedron, a graph system, or a
  // combination; whatever is absent is uploaded as zeros so the shader skips it
  // Everything a row contributes to a draw. Shared by the contact sheet and
  // both probes, so the probes also test the packing and upload of the row.
  function bindRow(U, rules, L, row){
    gl.uniform2uiv(U.rules, rules);
    gl.uniform1i(U.levels, L);
    gl.uniform1uiv(U.solidTail, row.solidTails[L]);
    const bricks = (row && row.bricks) || EMPTY_BRICKS;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, bricks.bits);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, bricks.next);

    if (row && row.planes){
      gl.uniform4iv(U.planes, row.planesPacked);
      gl.uniform1i(U.planeCount, Math.min(row.planes.length, MAXPLANES));
    } else {
      gl.uniform4iv(U.planes, ZERO_PLANES);
      gl.uniform1i(U.planeCount, 0);
    }
    if (row && row.graph){
      const g = row.graphPacked;
      gl.uniform2uiv(U.graphKeep, g.keep);
      gl.uniform4uiv(U.graphNext, g.next);
      gl.uniform1i(U.graphStates, g.count);
    } else {
      gl.uniform2uiv(U.graphKeep, ZERO_KEEP);
      gl.uniform4uiv(U.graphNext, ZERO_NEXT);
      gl.uniform1i(U.graphStates, 0);
    }
  }
  function drawOne(rect, rules, L, row){
    const Hpx = canvas.height;
    const vx = Math.round(rect.x * dpr), vw = Math.round(rect.w * dpr), vh = Math.round(rect.h * dpr);
    const vy = Hpx - Math.round((rect.y + rect.h) * dpr);
    if (vw <= 0 || vh <= 0) return;
    gl.viewport(vx, vy, vw, vh);
    gl.uniform3f(U.res, vw, vh, 1);
    gl.uniform2f(U.origin, vx, vy);
    bindRow(U, rules, L, row);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function draw(){
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.027, 0.027, 0.039, 1); gl.clear(gl.COLOR_BUFFER_BIT);

    if (imported){ drawOne(zoomRect(), imported.rules, imported.L, imported); return; }
    if (zoom){ drawOne(zoomRect(), rows[zoom.r].stacks[zoom.c], levelOf(zoom.c), rows[zoom.r]); return; }
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        drawOne(cellRect(r, c), rows[r].stacks[c], levelOf(c), rows[r]);
  }

  /* ---- lockstep selftest --------------------------------------------------
     classifyCPU() is this file's oracle: voxel counts, OBJ export and the
     Node tests all trust it. That is only worth something while it agrees
     with the shader, so this compares the two directly, on the GPU the page
     is actually running on. docs/lockstep-verification.md has the long form.

       classify probe  every cell at small L, a seeded sample at large L,
                       for every row of every axis under a matrix of depth
                       modes, g48, fields, densities and seeds. The
                       classifier is integer-only, so the bar is EXACT:
                       one differing cell is a bug.
       trace probe     the sheet's own rays through traceTower(), against
                       traceCPU() in float64. Float32 rays can legitimately
                       pick a neighbouring cell when they graze an edge, so
                       a mismatch is excused only when the exact ray passes
                       within GRAZE of the cell the shader chose (or barely
                       clips the one it missed). Everything else is "bad".

     Run it from the console (`await towerSelftest()`), with ?selftest in
     the URL, or headless through test/browser/lockstep.test.js.          */
  const probeClassify = link(PROBE_CLASSIFY_FRAG), probeTrace = link(PROBE_TRACE_FRAG);
  const PU = probeClassify && uniformsOf(probeClassify);
  const TU = probeTrace && uniformsOf(probeTrace);
  for (const P of [PU, TU]) if (P){
    gl.useProgram(P.prog);
    gl.uniform1i(P.brickBits, 0); gl.uniform1i(P.brickNext, 1); gl.uniform1i(P.probeCells, 2);
  }
  gl.useProgram(prog);
  let selftestBusy = false;

  const EXHAUSTIVE_CELLS = 1 << 18;   // every cell while S^3 <= 262,144
  const SAMPLED_CELLS = 1 << 14;      // otherwise a seeded sample this big
  const PROBE_WIDTH = 512;
  const TRACE_SIDE = 64;              // trace probe: 64 x 64 rays per case
  const GRAZE = 0.05;                 // in cells; see the header above

  function mulberry(seed){
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // An RGBA32UI target the probes render into; reused while the size fits.
  let probeFbo = null;
  function probeTarget(w, h){
    if (probeFbo && probeFbo.w === w && probeFbo.h === h) return probeFbo;
    if (probeFbo){ gl.deleteFramebuffer(probeFbo.fb); gl.deleteTexture(probeFbo.tex); }
    const tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32UI, w, h);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    probeFbo = { fb, tex, w, h };
    return probeFbo;
  }
  function runProbe(P, w, h, setup){
    const T = probeTarget(w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, T.fb);
    gl.useProgram(P.prog);
    gl.viewport(0, 0, w, h);
    setup();
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const out = new Uint32Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA_INTEGER, gl.UNSIGNED_INT, out);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.useProgram(prog);
    return out;
  }

  // Cells to classify: all of them when small, else a sample that leans on
  // the places a radix or residual mistake shows first: node faces and
  // corners (extreme digits) and, for polyhedra, cells straddling a plane.
  function probeCells(S, row, rng){
    const n = S * S * S, out = [];
    if (n <= EXHAUSTIVE_CELLS){
      for (let z = 0; z < S; z++) for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) out.push(x, y, z);
      return out;
    }
    const R = RADIX, pick = () => Math.floor(rng() * S);
    const extreme = () => {
      let v = 0;
      for (let s = S / R; s >= 1; s /= R){
        const r = rng();
        v += s * (r < 0.35 ? 0 : r < 0.7 ? R - 1 : Math.floor(rng() * R));
      }
      return v;
    };
    while (out.length < 3 * SAMPLED_CELLS){
      const r = rng();
      if (r < 0.5) out.push(pick(), pick(), pick());
      else if (r < 0.75 || !row.planes) out.push(extreme(), extreme(), extreme());
      else {
        // centre x_c = (2c + 1 - S)/S; solve the plane for one axis, take +-1
        const [A, B, C, T] = row.planes[Math.floor(rng() * row.planes.length)];
        const coef = [A, B, C], ax = coef.findIndex(v => v !== 0);
        const c = [pick(), pick(), pick()];
        let rest = T;
        for (let a = 0; a < 3; a++) if (a !== ax) rest -= coef[a] * (2*c[a] + 1 - S) / S;
        const xc = rest / coef[ax];
        c[ax] = Math.max(0, Math.min(S - 1, Math.floor(((xc + 1) * S - 1) / 2) + Math.floor(rng() * 3) - 1));
        out.push(c[0], c[1], c[2]);
      }
    }
    return out;
  }

  function classifyProbeCase(row, rules, L, rng, report, where){
    const S = Math.pow(RADIX, L), cells = probeCells(S, row, rng), n = cells.length / 3;
    const w = Math.min(PROBE_WIDTH, n), h = Math.ceil(n / w);
    const tex = new Uint32Array(w * h * 4);
    for (let i = 0; i < n; i++){ tex[4*i] = cells[3*i]; tex[4*i+1] = cells[3*i+1]; tex[4*i+2] = cells[3*i+2]; }
    const cellTex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, cellTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32UI, w, h, 0, gl.RGBA_INTEGER, gl.UNSIGNED_INT, tex);
    const got = runProbe(PU, w, h, () => bindRow(PU, rules, L, row));
    gl.deleteTexture(cellTex);

    const cfg = { rules, levels: L, planes: row.planes, graph: row.graph }, o = {};
    const tails = row.solidTails[L];
    for (let i = 0; i < n; i++){
      const c = [cells[3*i], cells[3*i+1], cells[3*i+2]];
      const size = classifyCPU(c, S, cfg, o);
      const cpu = [size, o.rejPlane + 1, solidExtentCPU(c, S, cfg, tails), 0xC0DE];
      const gpu = [got[4*i], got[4*i+1], got[4*i+2], got[4*i+3]];
      report.cells++;
      if (cpu[0] !== gpu[0] || cpu[1] !== gpu[1] || cpu[2] !== gpu[2] || cpu[3] !== gpu[3]){
        report.mismatches++;
        if (report.first.length < 12) report.first.push({ ...where, L, cell: c, gpu, cpu });
      }
    }
    report.cases++;
  }

  // Ray / box entry and exit, in world units; null when they don't meet.
  function rayBox(o, d, lo, hi){
    let t0 = -Infinity, t1 = Infinity;
    for (let a = 0; a < 3; a++){
      const ta = (lo[a] - o[a]) / d[a], tb = (hi[a] - o[a]) / d[a];
      t0 = Math.max(t0, Math.min(ta, tb)); t1 = Math.min(t1, Math.max(ta, tb));
    }
    return (t0 <= t1 && t1 >= 0) ? [t0, t1] : null;
  }
  const cellBox = (c, S, pad) => [c.map(v => (v - pad) / S * 2 - 1), c.map(v => (v + 1 + pad) / S * 2 - 1)];

  const TRACE_CAMS = [
    { name: "orbit-a", target: [0, 0, 0], radius: null, azimuth: 0.35, elevation: Math.atan(0.7) },
    { name: "orbit-b", target: [0, 0, 0], radius: null, azimuth: 2.2,  elevation: -0.3 },
    { name: "inside",  target: [0.11, 0.07, 0.031], radius: 0.5, azimuth: 0.9, elevation: 0.4 }
  ];
  function camBasis(cam){
    const k = new PushThroughCamera();
    k.target = cam.target.slice();
    if (cam.radius) k.radius = cam.radius;
    k.azimuth = cam.azimuth; k.elevation = cam.elevation;
    // the shader receives float32 uniforms; start the reference from the same values
    const b = k.basis(), f = v => v.map(Math.fround);
    return { eye: f(b.eye), forward: f(b.forward), right: f(b.right), up: f(b.up) };
  }

  function traceProbeCase(row, rules, L, cam, report, where){
    const S = Math.pow(RADIX, L), W = TRACE_SIDE, H = TRACE_SIDE, B = camBasis(cam);
    const got = runProbe(TU, W, H, () => {
      gl.uniform3f(TU.res, W, H, 1);
      gl.uniform2f(TU.origin, 0, 0);
      gl.uniform3fv(TU.eye, B.eye); gl.uniform3fv(TU.forward, B.forward);
      gl.uniform3fv(TU.right, B.right); gl.uniform3fv(TU.up, B.up);
      gl.uniform1i(TU.steps, STEP_CAP);
      bindRow(TU, rules, L, row);
    });
    const cfg = { rules, levels: L, planes: row.planes, graph: row.graph }, tails = row.solidTails[L];
    const occupied = c => c && classifyCPU(c, S, cfg) === 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const i = 4 * (y * W + x);
      const flags = got[i], steps = flags >>> 2;
      report.rays++;
      report.steps.push(steps);
      const perL = report.byL[L] || (report.byL[L] = { rays: 0, truncated: 0, graze: 0, bad: 0, maxSteps: 0 });
      perL.rays++; perL.maxSteps = Math.max(perL.maxSteps, steps);
      if (flags & 2){
        report.truncated++; perL.truncated++;
        if (report.firstTruncated.length < 6) report.firstTruncated.push({ ...where, L, cam: cam.name, pixel: [x, y] });
        continue;
      }
      const gHit = (flags & 1) !== 0;
      const gc = [got[i+1] & 0xffff, got[i+1] >>> 16, got[i+2]];
      const vx = ((x + 0.5) * 2 - W) / H, vy = ((y + 0.5) * 2 - H) / H;
      let d = [0, 1, 2].map(a => vx * B.right[a] + vy * B.up[a] + 1.8 * B.forward[a]);
      const len = Math.hypot(d[0], d[1], d[2]);
      d = d.map(v => { v /= len; return (v >= 0 ? 1 : -1) * Math.max(Math.abs(v), 1e-6); });
      const cpu = traceCPU(B.eye, d, S, cfg, tails);
      if (cpu.runaway) report.runaway++;
      if (gHit === cpu.hit && (!gHit || (gc[0] === cpu.cell[0] && gc[1] === cpu.cell[1] && gc[2] === cpu.cell[2]))){
        report.same++; continue;
      }
      // Excuses, both "the exact ray comes within GRAZE of a cell boundary":
      //   near  the shader's cell is occupied and the exact ray passes
      //         within GRAZE of it (the cell grown by GRAZE is hit);
      //   clip  the exact ray never gets more than GRAZE inside the cell
      //         the shader missed (the cell shrunk by GRAZE is missed).
      // A ray running almost parallel to a face can sit within 1e-3 cells of
      // it for a long way; float32 then legitimately walks the neighbouring
      // column and can surface far from the exact hit. That is a graze too.
      const near = gHit && occupied(gc) && !!rayBox(B.eye, d, ...cellBox(gc, S, GRAZE));
      const clip = cpu.hit && cpu.cell && !rayBox(B.eye, d, ...cellBox(cpu.cell, S, -GRAZE));
      let ok;
      if (gHit && cpu.hit){
        const r = near && rayBox(B.eye, d, ...cellBox(gc, S, GRAZE));
        ok = near && (clip || cpu.solid || r[0] <= cpu.t + GRAZE * 2 / S);
      } else ok = gHit ? near : clip;
      if (ok){ report.graze++; perL.graze++; }
      else {
        report.bad++; perL.bad++;
        if (report.first.length < 12) report.first.push({ ...where, L, cam: cam.name, pixel: [x, y],
          gpu: { hit: gHit, cell: gc, steps }, cpu: { hit: cpu.hit, cell: cpu.cell, t: cpu.t, solid: !!cpu.solid } });
      }
    }
    report.cases++;
  }

  // The settings each axis is probed under. Polyhedra and graph rows ignore
  // depth, g48 and seed (their stacks are all-pass), so they get one pass.
  function selftestMatrix(full){
    const out = [];
    const DEPTHS = full ? [[0, 0], [1, 13], [1, 47], [2, 0], [3, 0]] : [[0, 0], [1, 13]];
    for (let ax = 0; ax < AXIS_NAMES.length; ax++){
      if (ax === 2 || ax === 3){ out.push({ axis: ax, depthMode: 0, g48: 0, fieldMode: 0, densityIdx: 3, seed: 42 }); continue; }
      for (const [dm, g] of DEPTHS){
        if (ax === 4){
          for (let f = 0; f < (full ? FIELD_NAMES.length : 2); f++)
            for (const di of (full ? [1, 4] : [3]))
              out.push({ axis: ax, depthMode: dm, g48: g, fieldMode: f, densityIdx: di, seed: 42 });
        } else if (ax === 5){
          for (const sd of (full ? [42, 7] : [42]))
            out.push({ axis: ax, depthMode: dm, g48: g, fieldMode: 0, densityIdx: 3, seed: sd });
        } else out.push({ axis: ax, depthMode: dm, g48: g, fieldMode: 0, densityIdx: 3, seed: 42 });
      }
    }
    return out;
  }

  /* towerSelftest({ kind, full, axes, levels, traceLevels })
       kind         'classify' | 'trace' | 'both' (default 'both')
       full         the whole settings matrix (default true); false = a quick pass
       axes         restrict to these axis indices (default all)
       levels       L values for the classify probe (default 1..7)
       traceLevels  L values for the trace probe   (default 2, 4, 6, 7)
     Resolves to a report; `ok` is true when there is nothing to look at.  */
  async function towerSelftest(opts = {}){
    if (!PU || !TU) return { ok: false, error: "probe programs failed to compile (see console)" };
    const kind = opts.kind || "both", full = opts.full !== false;
    const levels = opts.levels || [1, 2, 3, 4, 5, 6, 7];
    const traceLevels = opts.traceLevels || [2, 4, 6, 7];
    const saved = { axis, depthMode, g48, fieldMode, densityIdx, seed, LMIN, LMAX, sel, zoom };
    const t0 = performance.now();
    const classify = { cases: 0, cells: 0, mismatches: 0, first: [] };
    const trace = { cases: 0, rays: 0, same: 0, graze: 0, bad: 0, truncated: 0, runaway: 0,
                    first: [], firstTruncated: [], byL: {}, steps: [] };
    selftestBusy = true;
    try {
      LMIN = 1; LMAX = 7; sel = null; zoom = null;
      // Traces are slow on software GL, so each axis is traced under its
      // first uniform setting and its first twisted one, not the whole matrix.
      const traced = new Set();
      for (const m of selftestMatrix(full)){
        if (opts.axes && !opts.axes.includes(m.axis)) continue;
        ({ axis, depthMode, g48, fieldMode, densityIdx, seed } = m);
        buildRows();
        const traceKey = `${m.axis}:${Math.min(m.depthMode, 1)}`;
        const doTrace = kind !== "classify" && m.depthMode <= 1 && !traced.has(traceKey);
        traced.add(traceKey);
        const rng = mulberry(0x5eed ^ (m.axis << 8) ^ (m.depthMode << 4) ^ m.g48 ^ (m.fieldMode << 12) ^ (m.seed << 16));
        for (let r = 0; r < rows.length; r++){
          const row = rows[r];
          const where = { axis: AXIS_NAMES[m.axis], row: row.label, depth: DEPTH_NAMES[m.depthMode], g48: m.g48,
                          field: FIELD_NAMES[m.fieldMode], density: DENSITIES[m.densityIdx], seed: m.seed };
          if (kind !== "trace")
            for (const L of levels) classifyProbeCase(row, row.stacks[L - LMIN], L, rng, classify, where);
          if (doTrace)
            for (const L of traceLevels) for (const cam of TRACE_CAMS)
              traceProbeCase(row, row.stacks[L - LMIN], L, cam, trace, where);
        }
        await new Promise(r => setTimeout(r, 0));   // let the page breathe between settings
      }
    } finally {
      ({ axis, depthMode, g48, fieldMode, densityIdx, seed, LMIN, LMAX, sel, zoom } = saved);
      selftestBusy = false;
      rerun();
    }
    const steps = trace.steps.sort((a, b) => a - b), q = p => steps.length ? steps[Math.min(steps.length - 1, Math.floor(p * steps.length))] : 0;
    delete trace.steps;
    Object.assign(trace, { p50: q(0.5), p99: q(0.99), p999: q(0.999), max: steps.length ? steps[steps.length - 1] : 0,
                           over384: steps.filter(s => s > 384).length });
    const report = { radix: RADIX, ms: Math.round(performance.now() - t0), classify, trace,
                     ok: classify.mismatches === 0 && trace.bad === 0 && trace.runaway === 0 };
    window.__selftest = report;
    return report;
  }
  window.towerSelftest = towerSelftest;

  /* towerSelftest.explain(entry): re-run one entry from a report's `first`
     or `firstTruncated` list and return everything about that one cell or
     ray -- both answers, the shader's t, occupancy of the cells involved,
     and the reference walk's path. For reading a failure, not for tests.  */
  towerSelftest.explain = async function explain(entry){
    const saved = { axis, depthMode, g48, fieldMode, densityIdx, seed, LMIN, LMAX, sel, zoom };
    selftestBusy = true;
    try {
      axis = AXIS_NAMES.indexOf(entry.axis); depthMode = DEPTH_NAMES.indexOf(entry.depth);
      fieldMode = FIELD_NAMES.indexOf(entry.field); densityIdx = DENSITIES.indexOf(entry.density);
      g48 = entry.g48; seed = entry.seed; LMIN = 1; LMAX = 7;
      buildRows();
      const row = rows.find(r => r.label === entry.row), L = entry.L, S = Math.pow(RADIX, L);
      const rules = row.stacks[L - LMIN];
      const cfg = { rules, levels: L, planes: row.planes, graph: row.graph }, tails = row.solidTails[L];
      const occ = c => c ? classifyCPU(c, S, cfg) : null;
      if (!entry.pixel) return { entry, cpu: occ(entry.cell), solidExtent: solidExtentCPU(entry.cell, S, cfg, tails) };
      const cam = TRACE_CAMS.find(c => c.name === entry.cam), B = camBasis(cam);
      const W = TRACE_SIDE, H = TRACE_SIDE, [x, y] = entry.pixel;
      const got = runProbe(TU, W, H, () => {
        gl.uniform3f(TU.res, W, H, 1); gl.uniform2f(TU.origin, 0, 0);
        gl.uniform3fv(TU.eye, B.eye); gl.uniform3fv(TU.forward, B.forward);
        gl.uniform3fv(TU.right, B.right); gl.uniform3fv(TU.up, B.up);
        gl.uniform1i(TU.steps, STEP_CAP);
        bindRow(TU, rules, L, row);
      });
      const i = 4 * (y * W + x), f32 = new Float32Array(new Uint32Array([got[i + 3]]).buffer)[0];
      const gc = [got[i+1] & 0xffff, got[i+1] >>> 16, got[i+2]];
      const vx = ((x + 0.5) * 2 - W) / H, vy = ((y + 0.5) * 2 - H) / H;
      let d = [0, 1, 2].map(a => vx * B.right[a] + vy * B.up[a] + 1.8 * B.forward[a]);
      const len = Math.hypot(d[0], d[1], d[2]);
      d = d.map(v => { v /= len; return (v >= 0 ? 1 : -1) * Math.max(Math.abs(v), 1e-6); });
      const cpu = traceCPU(B.eye, d, S, cfg, tails);
      const gpuBox = rayBox(B.eye, d, ...cellBox(gc, S, 0));
      return { entry, S, eye: B.eye, dir: d,
        gpu: { flags: got[i] & 3, steps: got[i] >>> 2, cell: gc, t: f32, classify: occ(gc), rayThroughCell: gpuBox },
        cpu: { ...cpu, classify: occ(cpu.cell) } };
    } finally {
      ({ axis, depthMode, g48, fieldMode, densityIdx, seed, LMIN, LMAX, sel, zoom } = saved);
      selftestBusy = false;
      rerun();
    }
  };

  gl.uniform1i(U.steps, QUALITY[qualityIdx]);
  buildRows();
  layout();

  {
    const q = stackFromLocation();
    if (q){
      const d = decodeStack(q);
      if (d && d.legacy) showToast("that ?t= link is a base-3 stack from v3 — open it in sol-v3-tower-contact-sheet.html");
      else if (d){
        imported = { rules: d.rules, L: d.L, voxels: voxelCount(d.rules, d.L) };
        imported.bricks = uploadBricks(compileRuleBricks(d.rules, d.L));
        imported.solidTails = [];
        imported.solidTails[d.L] = solidTails(d.rules, d.L, null);
        layout();
        showToast(`imported L=${d.L} stack — ${bigNum(imported.voxels)} voxels`);
      } else showToast("malformed ?t= stack ignored");
    }
  }
  paintHud();

  // ?selftest runs the quick matrix (a few seconds); ?selftest=full runs all
  // of it, ~1 min, mostly classifyCPU on the CPU side. Results: the toast,
  // the console, and window.__selftest.
  const selftestArg = /[?&]selftest(?:=(\w+))?/.exec(location.search);
  if (selftestArg){
    const full = selftestArg[1] === "full";
    showToast(`selftest (${full ? "full" : "quick"}) running…`);
    towerSelftest({ full }).then(r => {
      console.log("towerSelftest", r);
      showToast(r.ok ? `selftest ok — ${r.classify.cells.toLocaleString("en-US")} cells, ${r.trace.rays.toLocaleString("en-US")} rays`
                     : "selftest FAILED — see console");
    });
  }

  let last = performance.now(), acc = 0, frames = 0;
  function frame(now){
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (running && pointers.size === 0) camera.azimuth = (camera.azimuth + 0.4*dt) % (2*Math.PI);
    camera.update(dt);
    const basis = camera.basis();
    gl.uniform3fv(U.eye, basis.eye);
    gl.uniform3fv(U.forward, basis.forward);
    gl.uniform3fv(U.right, basis.right);
    gl.uniform3fv(U.up, basis.up);
    if (!selftestBusy) draw();
    acc += dt; frames++;
    if (acc >= 0.5){ fps = Math.round(frames / acc); acc = 0; frames = 0; paintHud(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

if (gl) main();
else { console.error("WebGL2 unavailable."); document.getElementById("hud").textContent = "needs WebGL2"; }
</script>
</body>
</html>
